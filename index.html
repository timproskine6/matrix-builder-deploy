    // PDF/DXF `line(xB, Y1b, xB+fanH, Y2)` loop.
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class','colfanLines');
    const svgW = Math.ceil(colX[colX.length-1] + fanH + 4);
    const svgH = Math.ceil(bandBottomY + 4);
    svg.setAttribute('width', svgW);
    svg.setAttribute('height', svgH);
    svg.style.width = svgW + 'px';
    svg.style.height = svgH + 'px';
    colX.forEach(x0=>{
      const ln = document.createElementNS(svgNS, 'line');
      ln.setAttribute('x1', x0); ln.setAttribute('y1', bandBottomY);
      ln.setAttribute('x2', x0 + fanH); ln.setAttribute('y2', bandTopY);
      ln.setAttribute('stroke', '#333'); ln.setAttribute('stroke-width', '1');
      svg.appendChild(ln);
    });
    host.appendChild(svg);

    // Diagonal label text: anchored at each column's center on the fan band's bottom edge, then
    // rotated -45deg — CSS rotate() is clockwise for positive angles, so a negative angle tilts
    // the normally-horizontal text up and to the right, about that anchor (transform-origin: left
    // bottom) — matching the exports' text running "uphill" between the fan lines.
    const pad = 4 * S45;
    flatCols.forEach((it,j)=>{
      const cx = (colX[j] + colX[j+1]) / 2;
      const label = document.createElement('div');
      label.className = 'colfanLabel';
      label.style.left = (cx + pad) + 'px';
      label.style.top = (bandBottomY - 12 - pad) + 'px';
      label.style.height = '12px';
      label.style.lineHeight = '12px';
      label.style.transform = 'rotate(-45deg)';
      label.textContent = it.label;
      host.appendChild(label);
    });
  }
}

/* ============================= DXF EXPORT ============================= */
function fmt(n){
  if(Math.abs(n) < 1e-9) n = 0;
  return n.toFixed(4);
}
function dxfEscape(s){
  return String(s).replace(/[\r\n]+/g,' ');
}

// Name of the dedicated text style every TEXT entity references (see DxfWriter's TABLES section).
const DXF_TEXT_STYLE = 'CEM_TEXT';
class DxfWriter{
  constructor(){
    this.parts = [];
    // A DXF with only an ENTITIES section has no LAYER or STYLE definitions of its own, so on
    // import AutoCAD falls back to whatever layers/styles already exist (or auto-creates) in the
    // host drawing — including their linetype and font. If the host drawing happens to already
    // have layers named the same as ours with a non-continuous linetype (dashed/center/hidden),
    // our lines inherit that and can look like a chaotic mess of ticks instead of clean solid
    // lines; and text renders in whatever font "Standard" (or whatever style gets auto-created)
    // happens to mean there, usually the blocky default SHX font, with no clean way to change just
    // this drawing's text without affecting everything else using the same shared style. Defining
    // our own uniquely-named (CEM_-prefixed) layers with an explicit continuous linetype, and a
    // dedicated text style pointing at a real TrueType font, makes the import self-contained and
    // predictable regardless of what's already in the target drawing.
    this.parts.push(
      // A minimal HEADER section declaring the DXF version and drawing units. Without $ACADVER,
      // a reader has no stated basis for expecting newer entity types like HATCH (introduced
      // after the R12/AC1009 era this file otherwise resembles, being built from only LINE/TEXT/
      // POLYLINE/TABLES so far) to be present, and without $INSUNITS there's no explicit record
      // that every coordinate in this file is in inches.
      '0\nSECTION\n2\nHEADER\n' +
        '9\n$ACADVER\n1\nAC1015\n' +
        '9\n$INSUNITS\n70\n1\n' +
        '9\n$MEASUREMENT\n70\n0\n' +
      '0\nENDSEC\n' +
      '0\nSECTION\n2\nTABLES\n' +
        '0\nTABLE\n2\nSTYLE\n70\n1\n' +
          `0\nSTYLE\n2\n${DXF_TEXT_STYLE}\n70\n0\n40\n0\n41\n1\n50\n0\n71\n0\n42\n1\n3\narial.ttf\n4\n\n` +
        '0\nENDTAB\n' +
        '0\nTABLE\n2\nLAYER\n70\n4\n' +
          '0\nLAYER\n2\nCEM_GRID\n70\n0\n62\n7\n6\nCONTINUOUS\n' +
          '0\nLAYER\n2\nCEM_TEXT\n70\n0\n62\n7\n6\nCONTINUOUS\n' +
          '0\nLAYER\n2\nCEM_MARKS\n70\n0\n62\n7\n6\nCONTINUOUS\n' +
          '0\nLAYER\n2\nCEM_TITLE\n70\n0\n62\n7\n6\nCONTINUOUS\n' +
        '0\nENDTAB\n' +
      '0\nENDSEC\n' +
      '0\nSECTION\n2\nENTITIES\n'
    );
  }
  finish(){ this.parts.push('0\nENDSEC\n0\nEOF\n'); return this.parts.join(''); }
  line(x1,y1,x2,y2,layer){
    this.parts.push(`0\nLINE\n8\n${layer}\n6\nCONTINUOUS\n10\n${fmt(x1)}\n20\n${fmt(y1)}\n30\n0\n11\n${fmt(x2)}\n21\n${fmt(y2)}\n31\n0\n`);
  }
  text(x,y,h,rot,str,layer){
    str = dxfEscape(str);
    this.parts.push(`0\nTEXT\n8\n${layer}\n10\n${fmt(x)}\n20\n${fmt(y)}\n30\n0\n40\n${fmt(h)}\n1\n${str}\n50\n${fmt(rot)}\n7\n${DXF_TEXT_STYLE}\n`);
  }
  filledDot(x,y,d,layer){
    // A solid-fill HATCH with a single full-circle arc boundary. The previous approach (an
    // old-style POLYLINE with two coincident, equal-width VERTEX entities — the classic "wide
    // zero-length segment" filled-dot trick) turned out not to reliably import as an actual
    // filled circle in current AutoCAD versions; it renders as a near-invisible artifact (just a
    // tiny grip point at the coordinate, no visible fill) instead. A HATCH is the format's own
    // dedicated filled-region entity and is universally supported, so it doesn't depend on that
    // older trick working the way it used to — same class of fix as the PDF export's filledDot(),
    // which had the same AutoCAD-import-reliability problem with its old Bezier-circle fills.
    const r = d/2;
    let s = `0\nHATCH\n8\n${layer}\n10\n0\n20\n0\n30\n0\n210\n0\n220\n0\n230\n1\n2\nSOLID\n70\n1\n71\n0\n91\n1\n`;
    s += `92\n1\n93\n1\n72\n2\n10\n${fmt(x)}\n20\n${fmt(y)}\n40\n${fmt(r)}\n50\n0\n51\n360\n73\n1\n`;
    s += `97\n0\n75\n1\n76\n1\n98\n0\n`;
    this.parts.push(s);
  }
}

// Spreadsheet-style column letter code for the header row directly above the data grid: 0->A,
// 1->B, ..., 25->Z, 26->AA, 27->AB, .... Shared by the PDF and DXF exports (and the HTML preview).
function colLetter(idx){
  let n = idx+1, s = '';
  while(n>0){ const rem=(n-1)%26; s = String.fromCharCode(65+rem)+s; n = Math.floor((n-1)/26); }
  return s;
}

// word-wrap a label into lines whose rendered length (chars*charWidth) fits within maxLen
// charWidthOrMeasure is either a flat per-character width (legacy approximation, used by the DXF
// export since AutoCAD substitutes its own fonts anyway) or a function(str)->width for exact
// per-glyph measurement (used by the PDF export, which always renders with real Helvetica metrics).
function wrapLabel(text, charWidthOrMeasure, maxLen){
  const measure = typeof charWidthOrMeasure === 'function'
    ? charWidthOrMeasure
    : (s => s.length*charWidthOrMeasure);
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const trial = cur ? cur + ' ' + w : w;
    if(measure(trial) <= maxLen || !cur){
      cur = trial;
    } else {
      lines.push(cur);
      cur = w;
    }
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [''];
}

// ---- Standard Helvetica / Helvetica-Bold AFM character widths (per 1000 em units) ----
// These are the official metrics baked into every PDF-1.4-compliant viewer for the standard 14
// fonts (no embedding needed), so measuring text this way — instead of a flat per-character
// average — gives pixel-accurate centering on every renderer, not just an approximation tuned
// against one test viewer.
const HELV_WIDTHS = {32:278,33:278,34:355,35:556,36:556,37:889,38:667,39:191,40:333,41:333,42:389,
  43:584,44:278,45:333,46:278,47:278,48:556,49:556,50:556,51:556,52:556,53:556,54:556,55:556,56:556,
  57:556,58:278,59:278,60:584,61:584,62:584,63:556,64:1015,65:667,66:667,67:722,68:722,69:667,70:611,
  71:778,72:722,73:278,74:500,75:667,76:556,77:833,78:722,79:778,80:667,81:778,82:722,83:667,84:611,
  85:722,86:667,87:944,88:667,89:667,90:611,91:278,92:278,93:278,94:469,95:556,96:333,97:556,98:556,
  99:500,100:556,101:556,102:278,103:556,104:556,105:222,106:222,107:500,108:222,109:833,110:556,
  111:556,112:556,113:556,114:333,115:500,116:278,117:556,118:500,119:722,120:500,121:500,122:500,
  123:334,124:260,125:334,126:584};
const HELV_BOLD_WIDTHS = {32:278,33:333,34:474,35:556,36:556,37:889,38:722,39:238,40:333,41:333,
  42:389,43:584,44:278,45:333,46:278,47:278,48:556,49:556,50:556,51:556,52:556,53:556,54:556,55:556,
  56:556,57:556,58:333,59:333,60:584,61:584,62:584,63:611,64:975,65:722,66:722,67:722,68:722,69:667,
  70:611,71:778,72:722,73:278,74:556,75:722,76:611,77:833,78:722,79:778,80:667,81:778,82:722,83:667,
  84:611,85:722,86:667,87:944,88:667,89:667,90:611,91:333,92:278,93:333,94:584,95:556,96:333,97:556,
  98:611,99:556,100:611,101:556,102:333,103:611,104:611,105:278,106:278,107:556,108:278,109:889,
  110:611,111:611,112:611,113:611,114:389,115:556,116:333,117:611,118:556,119:778,120:556,121:556,
  122:500,123:389,124:280,125:389,126:584};
// Returns the rendered width of str, in the same units as fontSize (e.g. inches, if fontSize is a
// height in inches) — sums real per-glyph advance widths instead of assuming a flat average.
function pdfTextWidth(str, fontSize, bold){
  const table = bold ? HELV_BOLD_WIDTHS : HELV_WIDTHS;
  let units = 0;
  for(let i=0;i<str.length;i++){
    const code = str.charCodeAt(i);
    units += table[code] !== undefined ? table[code] : 556;
  }
  return units/1000*fontSize;
}

function buildDxf(){
  const dxf = new DxfWriter();
  // CEM_-prefixed (not just "GRID"/"TEXT"/etc.) so these never collide with same-named layers that
  // might already exist in whatever drawing this gets inserted into — see the DxfWriter comment.
  const LAYER_GRID = 'CEM_GRID';
  const LAYER_TEXT = 'CEM_TEXT';
  const LAYER_DOT  = 'CEM_MARKS';
  const LAYER_TITLE= 'CEM_TITLE';

  // Inputs with zero outputs selected are dropped from the DXF entirely (they contribute nothing
  // to a cause & effect drawing) and the remaining rows are renumbered sequentially, 1..N.
  const inCats = state.inputCategories
    .map(cat => ({ name: cat.name, items: cat.items.filter(it => countChecked(it.id) > 0) }))
    .filter(cat => cat.items.length > 0);
  // Same rule for the output columns: outputs no input currently triggers are dropped from the
  // drawing (and categories that end up empty go with them).
  const outCats = state.outputCategories
    .map(cat => ({ name: cat.name, items: cat.items.filter(it => outputUsageCount(it.id) > 0) }))
    .filter(cat => cat.items.length > 0);
  const inputRows = []; // flat list with category ref, filtered + sequentially renumbered for the drawing
  inCats.forEach(cat=>cat.items.forEach(it=>inputRows.push({cat,item:it})));
  inputRows.forEach((r,i)=>{ r.drawNum = i+1; });
  const outputCols = [];
  outCats.forEach(cat=>cat.items.forEach(it=>outputCols.push({cat,item:it})));

  const numRows = inputRows.length;
  const numCols = outputCols.length;
  if(numRows===0 || numCols===0){ alert('Add at least one input with at least one output selected (and at least one output) before exporting.'); return null; }

  // ---- sizing constants (inches) ----
  const colW = 0.24;
  const textHRow = 0.09;      // row number / row label text height
  const textHCol = 0.10;      // column header text height (must be < colW)
  const textHCat = 0.085;     // category label text height
  const textHTitle = 0.20;    // SYSTEM INPUTS / SYSTEM OUTPUTS title text height
  const capHRatio = 0.718;    // same Helvetica cap-height ratio used in the PDF exporter's centering math
  // rowH is set so the row label's own vertical gap to the row's top/bottom dividing lines is the
  // same tight rowPad (0.05in) used to nudge the row text off its own top line and the diagonal
  // column headers off their seam — see the matching comment in buildMatrixPdf() — rather than the
  // far more generous gap that fell out of matching the column header's own spacing.
  const rowPad = 0.05;
  const rowH = textHRow*capHRatio + 2*rowPad;
  // Approximate char-width-to-height ratio for a standard CAD font. This is a deliberately
  // generous over-estimate (real "Standard"/txt.shx rendering in AutoCAD runs narrower than
  // this for most letters) so every band/column computed from it has real headroom — text
  // was previously overlapping neighboring bands because 0.62 cut it too close to the real
  // rendered width. Every text placement below also uses this same constant, so sizing and
  // positioning stay self-consistent even though it's oversized.
  const charW = 0.85;

  // number column is sized to snugly fit the longest row number (e.g. "34"), not a flat guess —
  // otherwise short numbers leave a wide dead gap before the label column's dividing line.
  const maxNumLen = String(numRows).length;
  const numColW = maxNumLen*textHRow*charW + 0.05;

  // dynamic label column width from longest input label
  const maxLabelLen = Math.max(10, ...inputRows.map(r=>r.item.label.length));
  const labelColW = Math.min(7.5, Math.max(2.2, maxLabelLen*textHRow*charW + 0.3));

  // dynamic header band height from longest output label
  const maxHeaderLen = Math.max(10, ...outputCols.map(c=>c.item.label.length));
  const S45 = Math.SQRT1_2; // cos(45°) === sin(45°) — used throughout the diagonal header geometry below
  // Column headers run diagonally at 45° (a common fire-alarm C&E matrix drafting convention)
  // instead of straight up: a short A/B/C... letter-code row sits directly above the data grid
  // (letterRowH tall), and above that the column names run up-and-to-the-right along parallel 45°
  // lines (fanH tall) — see the matching (exact, glyph-metric) derivation in buildMatrixPdf(); this
  // DXF version uses the same flat charW approximation as the rest of this exporter.
  const letterRowH = 0.20;
  const fanH = Math.min(9.0, Math.max(0.6, (maxHeaderLen*textHCol*charW + 0.16) * S45));
  const headerBandH = letterRowH + fanH;

  // dynamic row-category band width (wrap category names to fit each category's row-height span).
  // Floor and per-category width are both sized off the text's actual rendered thickness (capH),
  // not the generous h*1.4 stacking pitch — that pitch is only needed as the GAP BETWEEN wrapped
  // lines when a name spans more than one, not as the width of the single outermost line, so using
  // it even for the (overwhelmingly common) single-line case reserved far more room than the ink
  // needs. With the category text right-aligned tight against the numbers divider (X1), that extra
  // reserved width just became dead blank space between the text and the drawing's own left border
  // (X0) — this sizes the band to the text plus one small pad instead.
  const rowCatPad = 0.08;
  let rowCatColW = textHCat*capHRatio + rowCatPad;
  inCats.forEach(cat=>{
    const bandLen = Math.max(rowH, cat.items.length*rowH) - 0.06;
    const lines = wrapLabel(cat.name, textHCat*charW, bandLen);
    rowCatColW = Math.max(rowCatColW, (lines.length-1)*textHCat*1.4 + textHCat*capHRatio + rowCatPad);
  });

  // dynamic column-category band height similarly
  let colCatBandH = 0.34;
  { let accCols = 0;
    outCats.forEach(cat=>{
      const bandLen = Math.max(colW, cat.items.length*colW) - 0.06;
      const lines = wrapLabel(cat.name, textHCat*charW, bandLen);
      // Same fix as the PDF export / Full matrix preview: a 1-2 column category can force its name
      // into 3+ cramped stacked lines, which also stretches this shared band height for every OTHER
      // category. Past 2 lines, stop wrapping and render it as one line that spills into the blank
      // space to the right instead.
      cat._spill = lines.length > 2;
      cat._colStart = accCols;
      colCatBandH = Math.max(colCatBandH, (cat._spill ? 1 : lines.length)*textHCat*1.4 + 0.16);
      accCols += cat.items.length;
    });
  }

  const sysOutputsBandH = 0.40;
  // SYSTEM INPUTS sits in a horizontal title band directly above the row list (see Y1i below),
  // mirroring how SYSTEM OUTPUTS sits in a horizontal band above the column list, rather than
  // occupying its own dedicated vertical strip down the left edge — so there's no separate
  // "sysInputsBandW" column reserved here any more; the row-category band starts right at X0.
  const sysInputsBandH = 0.40;

  // ---- geometry ----
  const X0 = 0;
  const X1 = X0 + rowCatColW;        // end of row-category band / start of row numbers
  const X2 = X1 + numColW;           // end of row numbers / start of row labels
  const X3 = X2 + labelColW;         // end of row labels = start of data grid
  const X4 = X3;                     // alias: every other reference in this function treats X4 as "start of data grid"
  const X5 = X4 + numCols*colW;      // right edge of the real data grid
  // Same outer-frame extension as the PDF export: the fan's own rightmost diagonal divider rises
  // fanH to the right, so the frame needs widening for that alone; on top of that, if the last
  // category's name spilled past its own narrow column(s), extend it further to enclose that too
  // instead of leaving either one floating past the frame with nothing around it.
  const lastCat = outCats[outCats.length-1];
  let frameExtraW = fanH;
  if(lastCat && lastCat._spill){
    // The label is centered within the full span from the category's own left edge out to the
    // extended frame (see rendering below). Real margin on both sides (not just enough to avoid
    // clipping) so the centering is actually visible rather than looking identical to a tight
    // left-aligned fit.
    const lastCatLeftX = X4 + lastCat._colStart*colW;
    const lastLabelW = lastCat.name.length*textHCat*charW;
    frameExtraW = Math.max(frameExtraW, (lastCatLeftX + lastLabelW + 0.5) - X5);
  }
  const X5f = X5 + frameExtraW;      // outer-frame right edge (>= X5)

  const totalDataHeight = numRows*rowH;
  const Y0 = 0;
  const Y1 = Y0 + totalDataHeight;                 // top of data rows
  const Y1i = Y1 + sysInputsBandH;                  // top of the SYSTEM INPUTS title band
  const Y2 = Y1 + headerBandH;                      // top of column-header band
  const Y3 = Y2 + colCatBandH;                       // top of column-category band
  const Y4 = Y3 + sysOutputsBandH;                   // overall top

  // row i (0-index top to bottom) top/bottom Y
  function rowTopY(i){ return Y1 - i*rowH; }
  function rowBottomY(i){ return Y1 - (i+1)*rowH; }
  function rowCenterY(i){ return (rowTopY(i)+rowBottomY(i))/2; }
  // content anchor shared by the row number/label text AND the data-grid dots/note marks —
  // rowPad below the row's own top divider line (matching the tight hpad gap used for the
  // diagonal column headers), rather than the row's true geometric center, so the whole row
  // (numbers, labels, marks) reads as one vertically aligned unit.
  function rowMarkY(i){ return rowTopY(i) - rowPad - (textHRow*capHRatio)/2; }
  // col j (0-index left to right) left/right X
  function colLeftX(j){ return X4 + j*colW; }
  function colRightX(j){ return X4 + (j+1)*colW; }
  function colCenterX(j){ return (colLeftX(j)+colRightX(j))/2; }

  // ================= GRID LINES =================
  const Y1b = Y1+letterRowH; // top of the letter-code row / bottom seam the diagonal fan rises from
  // outer border + the X4 spine (divides row info from data columns, full height). X1/X2/X3 and
  // Y2/Y3 are internal dividers that only apply within the row area / column-header area
  // respectively — extending them into the blank corner block just draws an empty grid there.
  // The outer right border sits at X5f rather than X5 whenever the last category's name spilled
  // past the real data grid — see X5f above. The strip between X5 and X5f is left undivided (no
  // extra row/column lines inside it) since it isn't a real column.
  dxf.line(X0,Y0,X0,Y4,LAYER_GRID);
  // X4's outer-left border skips the fan band (Y1b..Y2) — the first diagonal fan line already
  // starts at this exact corner (X4,Y1b) and rises to (X4+fanH,Y2), so a straight vertical
  // continuing through that band as well just doubled up on the diagonal right next to where the
  // column-header text begins.
  dxf.line(X4,Y0,X4,Y1b,LAYER_GRID);
  dxf.line(X4,Y2,X4,Y4,LAYER_GRID);
  dxf.line(X5f,Y0,X5f,Y4,LAYER_GRID);
  // The Y1 seam (bottom of the letter-code row / top of row 1) is confined to the real content
  // width (X0..X5) — unlike Y0/Y4, it has no reason to cross the blank margin out to X5f since
  // nothing on either side of it exists out there.
  [Y0,Y4].forEach(y=> dxf.line(X0,y,X5f,y,LAYER_GRID));
  dxf.line(X0,Y1,X5,Y1,LAYER_GRID);
  // top seam of the SYSTEM INPUTS title band, confined to the row-info section's own width
  // (X0..X4) — analogous to the Y2/Y3 seams on the column side, which are similarly confined to
  // their own section's width instead of running the full outer-frame width.
  dxf.line(X0,Y1i,X4,Y1i,LAYER_GRID);
  // short connector at X4 bridging Y1b (where the diagonal fan actually starts) up to Y1i (where
  // the SYSTEM INPUTS seam ends) — the letter row (Y1..Y1b) is shorter than the SYSTEM INPUTS
  // band (Y1..Y1i), so without this the seam's right end and the fan's start point don't meet,
  // leaving a small gap that the since-removed full-height X4 spine used to paper over.
  dxf.line(X4,Y1b,X4,Y1i,LAYER_GRID);

  // interior row dividers + row-category dividers. A per-row line through the CATEGORY column
  // (tried briefly) cut through the vertical category text at every single row and looked
  // cluttered, so that column only gets dividers at the row-CATEGORY boundaries, not every row.
  // The numbers column gets a line at every row (matching the labels + data grid) since the
  // numbers are short and a full set of row lines there reads as a normal ruled list.
  for(let i=1;i<numRows;i++){ dxf.line(X1, rowTopY(i), X5, rowTopY(i), LAYER_GRID); }
  [X1,X2].forEach(x=> dxf.line(x,Y0,x,Y1,LAYER_GRID));
  { let acc=0;
    inCats.forEach((cat,ci)=>{
      acc += cat.items.length;
      if(ci < inCats.length-1){ const y = Y1-acc*rowH; dxf.line(X0,y,X1,y,LAYER_GRID); }
    });
  }

  // interior column dividers (data grid + header band), confined to the column-header area, except
  // Y2/Y3 which also extend into the blank margin (X5..X5f) so the category-name band's own
  // top/bottom borders form a continuous line matching the outer frame instead of leaving a notch.
  [Y2,Y3].forEach(y=> dxf.line(X4,y,X5f,y,LAYER_GRID));
  // Straight verticals only run through the data grid + letter-code row (Y0..Y1b) — above that,
  // the column dividers become the diagonal fan lines drawn below instead.
  // j<=numCols (not j<numCols) so the LAST real column also gets its own right-hand divider.
  for(let j=1;j<=numCols;j++){ dxf.line(colLeftX(j),Y0,colLeftX(j),Y1b,LAYER_GRID); }
  dxf.line(X4,Y1b,X5,Y1b,LAYER_GRID); // top seam of the letter-code row (bottom of the diagonal fan)
  // the diagonal fan itself: one 45° line per column boundary (numCols+1, including both outer
  // edges), each rising fanH up-and-to-the-right from its seam point — parallel lines, not a true
  // single-point fan. The rightmost one (at X5) rises into the blank margin out to X5f, which is
  // why the outer frame was widened by at least fanH above.
  for(let j=0;j<=numCols;j++){ const xB = colLeftX(j); dxf.line(xB,Y1b,xB+fanH,Y2,LAYER_GRID); }
  // column-category interior boundaries, spanning just the col-cat band
  { let acc=0;
    outCats.forEach((cat,ci)=>{
      acc += cat.items.length;
      if(ci < outCats.length-1){ const x = X4+acc*colW; dxf.line(x,Y2,x,Y3,LAYER_GRID); }
    });
  }

  // ================= TITLES =================
  // SYSTEM INPUTS (horizontal, spans X0..X4, Y1..Y1i) — a title band directly above the row list,
  // mirroring how SYSTEM OUTPUTS is a horizontal band directly above the column list, rather than
  // a vertical strip running the full row height down the left edge.
  placeHorizontalCentered((X0+X4)/2, (Y1+Y1i)/2, X4-X0-0.1, 'SYSTEM INPUTS', textHTitle, LAYER_TITLE);
  // SYSTEM OUTPUTS (horizontal, spans X4..X5f, Y3..Y4) — centered across the FULL title band, not
  // just the real data-grid width, otherwise it sits left-of-center whenever the frame is widened
  // for a spilled category label.
  placeHorizontalCentered((X4+X5f)/2, (Y3+Y4)/2, X5f-X4-0.1, 'SYSTEM OUTPUTS', textHTitle, LAYER_TITLE);

  // optional drawing title, centered in the blank corner block above the SYSTEM INPUTS band
  // (X0..X4, Y1i..Y4)
  const dTitle = (document.getElementById('drawingTitle').value||'').trim();
  if(dTitle){
    placeHorizontalCentered((X0+X4)/2, (Y1i+Y4)/2, X4-X0-0.2, dTitle, 0.16, LAYER_TITLE);
  }

  // ---- row category labels (vertical, wrapped, stacked, right-aligned tight against the row-
  // number divider X1 rather than centered in the band — any leftover slack from the shared band
  // width sits on the blank left side (toward X0) instead of splitting on both sides) ----
  { let acc=0;
    inCats.forEach(cat=>{
      const yTop = Y1-acc*rowH, yBot = Y1-(acc+cat.items.length)*rowH;
      placeVerticalRightAligned(X1, (yTop+yBot)/2, (yTop-yBot)-0.06, cat.name, textHCat, LAYER_TEXT);
      acc += cat.items.length;
    });
  }
  // ---- column category labels (horizontal, wrapped, stacked) ----
  { let acc=0;
    outCats.forEach(cat=>{
      const xL = X4+acc*colW, xR = X4+(acc+cat.items.length)*colW;
      if(cat._spill){
        // Too narrow to wrap the name cleanly — single line, centered within the full span from
        // this category's left edge out to the extended outer frame (X5f), not left-aligned.
        const labelW = cat.name.length*textHCat*charW;
        const cx = (xL+X5f)/2;
        dxf.text(cx-labelW/2, (Y2+Y3)/2 - textHCat*0.36, textHCat, 0, cat.name, LAYER_TEXT);
      } else {
        placeHorizontalWrapped(Y2, Y3, (xL+xR)/2, (xR-xL)-0.06, cat.name, textHCat, LAYER_TEXT);
      }
      acc += cat.items.length;
    });
  }

  // ---- row numbers + labels ---- anchored to rowMarkY (rowPad below the row's own top
  // divider line), not vertically centered in the row band, matching the tight hpad gap used for
  // the diagonal column headers, rather than the much larger gap pure vertical centering gave.
  inputRows.forEach((r,i)=>{
    const yBase = rowMarkY(i) - (textHRow*capHRatio)/2;
    const numStr = String(r.drawNum);
    const numW = numStr.length*textHRow*charW;
    dxf.text(X1+(numColW-numW)/2, yBase, textHRow, 0, numStr, LAYER_TEXT);
    dxf.text(X2+0.03, yBase, textHRow, 0, r.item.label, LAYER_TEXT);
  });

  // ---- letter codes (A, B, C...), horizontal, centered in each column directly above the grid ----
  outputCols.forEach((c,j)=>{
    const letter = colLetter(j);
    const letterW = letter.length*textHRow*charW;
    dxf.text(colCenterX(j)-letterW/2, (Y1+Y1b)/2 - textHRow*0.35, textHRow, 0, letter, LAYER_TEXT);
  });
  // ---- column headers, running diagonally at 45° above the letter row ----
  // Bottom-anchored to the same seam (Y1b) every column shares, same derivation as buildMatrixPdf():
  // anchor = strip's bottom-center (xMid, Y1b), nudged hpad forward along the 45° reading direction
  // plus capH/2 along the perpendicular direction (sinθ, -cosθ) to center the text on the strip.
  { const capH = textHCol*capHRatio, hpad = 0.05;
    outputCols.forEach((c,j)=>{
      const xMid = colLeftX(j) + colW/2;
      const ax = xMid + S45*(hpad + capH*0.5);
      const ay = Y1b + S45*(hpad - capH*0.5);
      dxf.text(ax, ay, textHCol, 45, c.item.label, LAYER_TEXT);
    });
  }

  // ---- outer border reinforcement (already covered by spines) ----

  // ---- marks ---- vertically aligned to rowMarkY (same tightened anchor as the row number/label
  // text above), not the row's true geometric center, so the dots/notes line up with the text.
  inputRows.forEach((r,i)=>{
    const ym = rowMarkY(i);
    outputCols.forEach((c,j)=>{
      const st = cellState(r.item.id, c.item.id);
      if(st===true){
        const d = Math.min(rowH,colW)*0.62;
        dxf.filledDot(colCenterX(j), ym, d, LAYER_DOT);
      } else if(st==='note'){
        const s = '(1)';
        const h = Math.min(rowH,colW)*0.32;
        const lineLen = s.length*h*charW;
        dxf.text(colCenterX(j)-lineLen/2, ym-h*0.35, h, 0, s, LAYER_DOT);
      }
    });
  });

  /* ---------- local placement helpers (rotation 0 / 90 only) ---------- */
  function placeHorizontalCentered(cx, cy, availW, text, h, layer){
    const lines = wrapLabel(text, h*charW, availW);
    const spacing = h*1.4;
    // vertically center the whole (possibly multi-line) block on cy — see the matching PDF helper
    // for the derivation; same fix applies here (previously the block sat too high, biased toward
    // the top of its band instead of straddling the center).
    let y = cy + (lines.length-1)*spacing/2 - h*0.36;
    lines.forEach(line=>{
      const len = line.length*h*charW;
      dxf.text(cx-len/2, y, h, 0, line, layer);
      y -= spacing;
    });
  }
  // Right-aligned vertical text: the insertion x IS the ink's right edge for 90°-rotated text (the
  // glyph's cap-height band extends leftward, in -X, from the insertion point — this is exactly the
  // offset placeVerticalCentered's old "+h*0.35" nudge was correcting for when centering), so unlike
  // the centered helper, no capH/2 correction is needed here: anchoring the raw insertion x at
  // (xRight - pad) puts the ink's right edge flush against xRight with that small pad to spare.
  function placeVerticalRightAligned(xRight, cy, availH, text, h, layer){
    const lines = wrapLabel(text, h*charW, availH);
    const spacing = h*1.4;
    const pad = 0.05;
    let x = xRight - pad;
    lines.forEach(line=>{
      const len = line.length*h*charW;
      dxf.text(x, cy-len/2, h, 90, line, layer);
      x -= spacing;
    });
  }
  function placeHorizontalWrapped(yBottom, yTop, cx, availW, text, h, layer){
    placeHorizontalCentered(cx, (yBottom+yTop)/2, availW, text, h, layer);
  }

  return dxf.finish();
}

document.getElementById('btnExportDXF').addEventListener('click', ()=>{
  const content = buildDxf();
  if(!content) return;
  const blob = new Blob([content], {type:'application/dxf'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const t = (document.getElementById('drawingTitle').value||'cause_effect_matrix').trim().replace(/[^a-z0-9_\- ]/gi,'').replace(/\s+/g,'_');
  a.download = (t || 'cause_effect_matrix') + '.dxf';
  document.body.appendChild(a); a.click(); a.remove();
});

/* ============================= CSV EXPORT ============================= */
function csvEscape(s){
  s = String(s);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function buildCsv(){
  // Mirrors the same rules as the DXF export and Full Matrix Preview: inputs with zero outputs
  // selected are dropped and remaining rows renumbered sequentially; outputs no input triggers
  // are dropped; categories that end up empty are dropped along with them.
  const inCats = state.inputCategories
    .map(cat => ({ name: cat.name, items: cat.items.filter(it => countChecked(it.id) > 0) }))
    .filter(cat => cat.items.length > 0);
  const outCats = state.outputCategories
    .map(cat => ({ name: cat.name, items: cat.items.filter(it => outputUsageCount(it.id) > 0) }))
    .filter(cat => cat.items.length > 0);

  if(inCats.length===0 || outCats.length===0){
    alert('Add at least one input with at least one output selected (and at least one output) before exporting.');
    return null;
  }

  const outputCols = [];
  outCats.forEach(cat=>cat.items.forEach(it=>outputCols.push({cat,item:it})));

  const rows = [];
  // header row 1: output category name, once per group (blank for the rest of that group's columns)
  const headRow1 = ['ROW CATEGORY','#','SYSTEM INPUT'];
  outCats.forEach(cat=>{
    headRow1.push(cat.name);
    for(let i=1;i<cat.items.length;i++) headRow1.push('');
  });
  rows.push(headRow1);
  // header row 2: individual output labels
  const headRow2 = ['','','SYSTEM OUTPUT →'];
  outputCols.forEach(c=>headRow2.push(c.item.label));
  rows.push(headRow2);

  let seq = 0;
  inCats.forEach(cat=>{
    cat.items.forEach(it=>{
      seq++;
      const row = [cat.name, seq, it.label];
      outputCols.forEach(c=>{
        const st = cellState(it.id, c.item.id);
        row.push(st===true ? 'X' : st==='note' ? '(1)' : '');
      });
      rows.push(row);
    });
  });

  return rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
}

document.getElementById('btnExportCSV').addEventListener('click', ()=>{
  const content = buildCsv();
  if(content==null) return;
  // Prepend a UTF-8 BOM so Excel opens it correctly rather than mangling encoding.
  const blob = new Blob(['﻿' + content], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const t = (document.getElementById('drawingTitle').value||'cause_effect_matrix').trim().replace(/[^a-z0-9_\- ]/gi,'').replace(/\s+/g,'_');
  a.download = (t || 'cause_effect_matrix') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
});

loadState(DEFAULT_DATA);
