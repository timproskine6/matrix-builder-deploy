<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cause &amp; Effect Matrix Builder</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --border:#d7dbe0; --border-strong:#aab0b8;
    --ink:#1b1f24; --ink-soft:#5b6470; --accent:#1f6feb; --accent-soft:#e8f1ff;
    --good:#0f7b3f; --note:#b45309; --danger:#c0392b; --row-alt:#fafbfc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 14px;
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
  header h1{font-size:15px;margin:0 12px 0 0;font-weight:700;white-space:nowrap;}
  header .sp{flex:1;}
  header input#drawingTitle{font-size:12px;padding:6px 8px;border:1px solid var(--border);
    border-radius:6px;min-width:160px;flex:1;max-width:320px;}
  button{font:inherit;font-size:12px;padding:7px 11px;border-radius:6px;border:1px solid var(--border);
    background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;}
  button:hover{background:#f0f2f5;}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.primary:hover{background:#1a5fd0;}
  button.ghost{background:transparent;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  #fileImport{display:none;}

  main{flex:1;display:flex;min-height:0;overflow:hidden;}
  .panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;}
  #leftPanel{width:38%;min-width:280px;max-width:560px;border-right:1px solid var(--border);}
  #rightPanel{flex:1;min-width:280px;}
  .panel-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .panel-head h2{font-size:12.5px;margin:0;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);flex:1;}
  .panel-body{flex:1;overflow-y:auto;padding:6px 0 40px 0;}
  .search{margin:8px 10px 0 10px;}
  .search input{width:100%;padding:7px 9px;font-size:12.5px;border:1px solid var(--border);border-radius:6px;}

  .category{margin:8px 8px 0 8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff;}
  .cat-head{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#f6f7f9;cursor:pointer;user-select:none;}
  .cat-head .tri{font-size:10px;color:var(--ink-soft);width:12px;}
  .cat-head .name{flex:1;font-size:12px;font-weight:700;letter-spacing:.02em;}
  .cat-head .count{font-size:10.5px;color:var(--ink-soft);background:#eceff2;border-radius:10px;padding:1px 7px;}
  .cat-head button.tiny{padding:2px 6px;font-size:11px;}
  .cat-items{}
  .cat-items.collapsed{display:none;}

  .row-item{position:relative;overflow:hidden;border-top:1px solid #eef0f2;cursor:pointer;font-size:12.5px;}
  .row-item.notused{opacity:.5;font-style:italic;cursor:default;}
  .row-item.notused .row-content:hover{background:none;}
  .row-swipe-bg{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;
    align-items:center;justify-content:flex-end;padding-right:18px;font-weight:700;font-size:11px;
    letter-spacing:.03em;}
  .row-content{position:relative;z-index:1;display:flex;align-items:center;gap:8px;
    padding:7px 10px 7px 10px;background:#fff;touch-action:pan-y;}
  .row-item:hover .row-content{background:var(--accent-soft);}
  .row-item.selected .row-content{background:var(--accent-soft);border-left:3px solid var(--accent);padding-left:7px;}
  .row-content .bulk-check{flex-shrink:0;width:14px;height:14px;margin:0;cursor:pointer;accent-color:var(--accent);}
  .row-content .bulk-check-spacer{flex-shrink:0;width:14px;display:inline-block;}
  .row-content .num{font-variant-numeric:tabular-nums;color:var(--ink-soft);width:26px;flex-shrink:0;font-size:11px;}
  .row-content .lbl{flex:1;line-height:1.3;}
  .row-content .badge{font-size:10px;background:#eceff2;color:var(--ink-soft);border-radius:9px;padding:1px 6px;flex-shrink:0;}
  .row-item.selected .badge{background:var(--accent);color:#fff;}
  .row-content .del{opacity:0;flex-shrink:0;color:var(--danger);font-size:14px;padding:0 4px;}
  .row-item:hover .del{opacity:.6;}
  .row-content .del:hover{opacity:1;}

  .add-row{padding:6px 10px 6px 22px;}
  .add-row button{width:100%;font-size:11.5px;padding:5px;color:var(--ink-soft);border-style:dashed;}
  .add-cat-btn{margin:10px;width:calc(100% - 20px);}

  .empty-hint{padding:8px 10px 8px 22px;font-size:11.5px;color:var(--ink-soft);font-style:italic;}
  .cat-tag{font-size:9.5px;color:var(--ink-soft);background:#eceff2;border-radius:8px;padding:1px 6px;margin-left:6px;
    font-style:normal;letter-spacing:.01em;white-space:nowrap;}
  .category.unused-section{border-color:#e8dcc0;}
  .category.unused-section .cat-head{background:#fbf6ea;}
  .category.unused-section .name{color:#7a5c15;}

  #rightEmpty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
    font-size:13px;text-align:center;padding:30px;}

  .out-row{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 22px;border-top:1px solid #eef0f2;font-size:12.5px;}
  .out-row.notused{opacity:.4;font-style:italic;}
  .out-row .lbl{flex:1;line-height:1.3;}
  .tri-toggle{display:flex;border:1px solid var(--border);border-radius:14px;overflow:hidden;flex-shrink:0;}
  .tri-toggle button{border:none;border-radius:0;padding:4px 9px;font-size:10.5px;background:#fff;color:var(--ink-soft);}
  .tri-toggle button+button{border-left:1px solid var(--border);}
  .tri-toggle button.active-off{background:#f0f2f5;color:var(--ink);}
  .tri-toggle button.active-on{background:var(--good);color:#fff;}
  .tri-toggle button.active-note{background:var(--note);color:#fff;}

  select.hAlignSel{font-size:11px;}

  #selectedInputBar{padding:9px 12px;background:var(--accent-soft);border-bottom:1px solid var(--border);
    font-size:12.5px;display:flex;align-items:center;gap:8px;}
  #selectedInputBar b{font-weight:700;}
  #selectedInputBar .muted{color:var(--ink-soft);}

  footer{border-top:1px solid var(--border);background:var(--panel);padding:6px 12px;font-size:11px;color:var(--ink-soft);
    display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  footer .legend{display:flex;gap:4px;align-items:center;}
  footer .dot{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block;}
  footer .noteDot{width:9px;height:9px;border-radius:50%;background:var(--note);display:inline-block;}

  /* Full matrix preview modal */
  #matrixModal{position:fixed;inset:0;background:rgba(20,22,26,.55);display:none;align-items:stretch;
    justify-content:stretch;z-index:50;}
  #matrixModal.open{display:flex;}
  #matrixModalInner{margin:auto;background:#fff;width:96vw;height:92vh;border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35);}
  #matrixModalHead{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  #matrixModalHead h2{font-size:13px;margin:0;flex:1;}
  #matrixScroll{flex:1;overflow:auto;position:relative;background:#fff;}

  table.gridtable{border-collapse:collapse;font-size:10px;}
  table.gridtable th, table.gridtable td{border:1px solid #333;padding:0;text-align:center;}
  /* Row height here tracks the PDF/DXF export's rowH (0.233in, up from 0.13in — a ~1.79x growth
     when build 64 made rowH match the column header's own text-to-line gap) so this read-only
     preview's proportions stay consistent with the real drawing: 14px * (0.233/0.13) ≈ 25px. */
  table.gridtable td.datacell{width:22px;min-width:22px;height:25px;max-height:25px;}
  table.gridtable td.rownum, table.gridtable td.rowlabel{height:25px;max-height:25px;}
  table.gridtable td.datacell .dotmark{width:9px;height:9px;border-radius:50%;background:#111;margin:0 auto;}
  table.gridtable td.datacell .notemark{font-size:9px;color:var(--note);font-weight:700;}
  table.gridtable td.datacell.nu, table.gridtable th.nu{background:repeating-linear-gradient(45deg,#f4f4f4,#f4f4f4 4px,#ececec 4px,#ececec 8px);}
  /* Matches the PDF/DXF exports' 45-degree diagonal "fan" header: th.colfan is the tall band
     directly above the letter-code row, left empty on purpose (its height is set by JS below,
     from a measurement pass, same reasoning as .colcatOverlay) — the diagonal label text and
     the diagonal fan divider lines are both drawn as absolutely-positioned overlays on top of
     it, living outside the table DOM for the same cross-browser-reliability reason as the
     category overlay. th.colletter is the short row of single-letter column codes (A, B, C...)
     sitting directly above the data grid, mirroring the exports' letterRowH band. */
  table.gridtable th.colfan{position:relative;background:#fff;padding:0;}
  table.gridtable th.colletter{height:18px;max-height:18px;font-size:9px;font-weight:700;
    background:#fafbfc;color:var(--ink-soft);}
  .colfanLabel{position:absolute;white-space:nowrap;font-weight:600;font-size:10px;
    transform-origin:left bottom;pointer-events:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111;}
  .colfanLines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;}
  table.gridtable th.colcat{background:#f0f2f5;height:22px;}
  /* Category-header labels are drawn as a separate overlay layer (see .colcatOverlay below), NOT
     as text content inside th.colcat. A narrow (1-2 column) category's name would otherwise force
     the browser's table auto-layout to stretch that column to fit the whole label on one line —
     and doing this via an absolutely-positioned child *inside* the table cell isn't reliable across
     engines (Safari's table intrinsic-sizing pass can resolve a percentage width against the wrong
     containing block there). Living entirely outside the table's DOM, the overlay can't feed back
     into column sizing in any browser, while still being positioned pixel-for-pixel over the real
     header band once it's rendered. A label too wide for its own band is wrapped onto multiple
     centered lines (mirroring the PDF/DXF export's category-header wrapping) rather than left to
     overflow past the band's edge, which used to visibly collide with the next category's label. */
  .colcatOverlay{position:absolute;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;line-height:1.3;
    font-weight:700;font-size:10.5px;padding:0 5px;box-sizing:border-box;pointer-events:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111;}
  /* Blank bordered margin to the right of the true last data column, reserved for a spilled last
     category label (see the spill-box logic in renderMatrixPreview) — mirrors the PDF/DXF exports'
     extended outer frame. No left border: the real last column's own right border already closes
     that edge, so drawing one here would just double it. */
  .colcatSpillBox{position:absolute;border-top:1px solid #333;border-right:1px solid #333;
    border-bottom:1px solid #333;box-sizing:border-box;background:#fff;pointer-events:none;}
  td.rownum{width:24px;background:#fafbfc;font-size:10px;color:var(--ink-soft);}
  table.gridtable td.rowlabel{text-align:left;padding:1px 3px;white-space:nowrap;font-size:10.5px;background:#fff;position:sticky;left:0;}
  table.gridtable td.rowcat{background:#f0f2f5;font-weight:700;font-size:10.5px;writing-mode:vertical-rl;transform:rotate(180deg);
    white-space:normal;position:sticky;left:0;padding:4px 2px;box-sizing:border-box;overflow:hidden;
    word-break:normal;overflow-wrap:normal;line-height:1.2;}
  th.corner{background:#fff;position:sticky;left:0;top:0;z-index:3;}
  th.topleftTitle{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:14px;
    position:sticky;left:0;background:#fff;z-index:2;}
  th.outputsTitle{font-weight:800;font-size:16px;background:#fff;position:sticky;top:0;z-index:2;}
  /* keeps the title visually centered in the scrolled viewport even though the cell it lives in
     spans every output column (which is usually much wider than what's on screen at once) */
  th.outputsTitle .stickyCenter{position:sticky;left:0;right:0;display:table;
    margin:0 auto;white-space:nowrap;}
  thead th{position:sticky;background:#fff;}

  @media (max-width: 820px){
    main{flex-direction:column;}
    #leftPanel{width:100%;max-width:none;border-right:none;border-bottom:1px solid var(--border);height:42%;}
    #rightPanel{height:58%;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Cause &amp; Effect Matrix Builder</h1>
    <input id="drawingTitle" placeholder="Drawing title (optional, shown on DXF)">
    <div class="sp"></div>
    <button id="btnFullView" class="ghost">Full matrix view</button>
    <button id="btnReset" class="ghost">Reset to sample data</button>
    <button id="btnImport" class="ghost">Import JSON</button>
    <button id="btnExportJSON" class="ghost">Export JSON</button>
    <button id="btnExportCSV" class="ghost">Export CSV</button>
    <button id="btnExportPDF" class="ghost">Export PDF</button>
    <button id="btnExportDXF" class="primary">Export DXF</button>
    <input type="file" id="fileImport" accept="application/json">
  </header>

  <main>
    <section id="leftPanel" class="panel">
      <div class="panel-head">
        <h2>System Inputs</h2>
        <span class="sp" style="flex:1"></span>
        <button id="btnClearSelectedInputs" class="ghost" style="display:none;">Clear outputs for selected</button>
        <button id="btnDeselectInputs" class="ghost" style="display:none;">✕</button>
      </div>
      <div class="search"><input id="inputSearch" placeholder="Filter inputs…"></div>
      <div class="panel-body" id="inputList"></div>
      <button class="add-cat-btn" id="addInputCat">+ Add input category</button>
    </section>

    <section id="rightPanel" class="panel">
      <div id="selectedInputBar" style="display:none;">
        <span class="muted">Outputs for</span> <b id="selectedInputLabel"></b>
        <span class="sp" style="flex:1"></span>
        <button id="btnClearInputOutputs" class="ghost">Clear all outputs for this input</button>
      </div>
      <div id="rightEmpty">Select a system input on the left to choose which outputs it triggers.</div>
      <div class="panel-head" id="outputsHead" style="display:none;">
        <h2>System Outputs</h2>
      </div>
      <div class="search" id="outputSearchWrap" style="display:none;"><input id="outputSearch" placeholder="Filter outputs…"></div>
      <div class="panel-body" id="outputList" style="display:none;"></div>
      <button class="add-cat-btn" id="addOutputCat" style="display:none;">+ Add output category</button>
    </section>
  </main>

  <footer>
    <span class="legend"><span class="dot"></span> triggers output (click cycles: off → on → note → off)</span>
    <span class="legend"><span class="noteDot"></span> conditional / see note</span>
    <span class="sp" style="flex:1"></span>
    <span id="statusMsg"></span>
    <span style="color:#c3c8ce;">· build 84</span>
  </footer>
</div>

<div id="matrixModal">
  <div id="matrixModalInner">
    <div id="matrixModalHead">
      <h2>Full matrix preview (read-only) — compare against source drawing</h2>
      <div class="sp" style="flex:1"></div>
      <button id="closeMatrixModal">Close</button>
    </div>
    <div id="matrixScroll"></div>
  </div>
</div>

<script>
/* ============================= DEFAULT DATA =============================

   57 system inputs, 41 system outputs, extracted + verified from the source PDF.
========================================================================== */

,"o3":true,"o4":true,"o5":true,"o6":true,"o7":true,"o9":true,"o10":true},"i11":{"o0":true,"o3":true,"o4":true,"o5":true,"o6":true,"o7":true,"o9":true,"o10":true},"i14":{"o1":true,"o3":true,"o4":true,"o5":true,"o29":true,"o11":true},"i15":{"o1":true,"o3":true,"o4":true,"o5":true,"o29":true,"o11":true},"i16":{"o1":true,"o3":true,"o4":true,"o5":true,"o11":true},"i17":{"o1":true,"o3":true,"o4":true,"o5":true,"o11":true},"i18":{"o1":true,"o3":true,"o4":true,"o5":true,"o11":true},"i41":{"o2":true,"o3":true,"o4":true,"o5":true,"o12":true},"i42":{"o2":true,"o3":true,"o4":true,"o5":true,"o12":true},"i43":{"o2":true,"o3":true,"o4":true,"o5":true,"o12":true},"i44":{"o2":true,"o3":true,"o4":true,"o5":true,"o12":true},"i45":{"o2":true,"o3":true,"o4":true,"o5":true,"o12":true},"i46":{"o2":true,"o3":true,"o4":true,"o5":true,"o12":true},"i12":{"o0":true,"o3":true,"o4":true,"o5":true,"o6":true,"o7":true,"o9":true,"o10":true},"i13":{"o0":true,"o3":true,"o4":true,"o5":true,"o6":true,"o7":true,"o9":true,"o10":true},"i24":{"o1":true,"o3":true,"o4":true,"o5":true,"o11":true},"i25":{"o1":true,"o3":true,"o4":true,"o5":true,"o11":true},"i26":{"o1":true,"o3":true,"o4":true,"o5":true,"o11":true},"i60":{"o1":true,"o3":true,"o4":true,"o5":true,"o11":true},"i61":{"o1":true,"o3":true,"o4":true,"o5":true,"o11":true},"i2":{"o0":true,"o3":true,"o4":true,"o5":true,"o6":true,"o7":true,"o10":true}}};

/* ============================= STATE ============================= */
let state = null;          // {inputCategories, outputCategories, matrix}
let selectedInputId = null;
let bulkSelectedInputs = new Set(); // input ids checked for multi-select bulk actions

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function loadState(data){
  state = deepClone(data);
  selectedInputId = null;
  bulkSelectedInputs.clear();
  // The system-inputs category list loads mostly rolled up — only the categories named
  // here start expanded; the rest (and any new/renamed categories) start collapsed, and the
  // user expands them as needed via the triangle arrow.
  const DEFAULT_EXPANDED_INPUT_CATS = ['ALARM INITIATION', 'SUPERVISORY INITIATION', 'TROUBLE INITIATION'];
  inputCollapsed.clear();
  state.inputCategories.forEach((cat, ci)=>{ if(!DEFAULT_EXPANDED_INPUT_CATS.includes(cat.name)) inputCollapsed.add(ci); });
  unusedInputsCollapsed = true;
  renderAll();
}
function uid(prefix){
  return prefix + '_' + Math.random().toString(36).slice(2,9);
}

/* ============================= HELPERS ============================= */
function allInputItems(){
  const out = [];
  state.inputCategories.forEach((cat,ci)=>cat.items.forEach((it,ii)=>out.push({cat,ci,ii,item:it})));
  return out;
}
function allOutputItems(){
  const out = [];
  state.outputCategories.forEach((cat,ci)=>cat.items.forEach((it,ii)=>out.push({cat,ci,ii,item:it})));
  return out;
}
function findInput(id){ return allInputItems().find(x=>x.item.id===id); }
function findOutput(id){ return allOutputItems().find(x=>x.item.id===id); }
function cellState(inputId, outputId){
  const row = state.matrix[inputId];
  if(!row) return false;
  return row[outputId] || false; // false | true | 'note'
}
function setCellState(inputId, outputId, val){
  if(!state.matrix[inputId]) state.matrix[inputId] = {};
  if(val===false){ delete state.matrix[inputId][outputId]; if(Object.keys(state.matrix[inputId]).length===0) delete state.matrix[inputId]; }
  else state.matrix[inputId][outputId] = val;
}
function countChecked(inputId){
  const row = state.matrix[inputId];
  if(!row) return 0;
  return Object.keys(row).length;
}
function outputUsageCount(outputId){
  // how many inputs currently trigger this output (On or Note)
  let n = 0;
  Object.keys(state.matrix).forEach(inId=>{
    if(state.matrix[inId] && state.matrix[inId][outputId]) n++;
  });
  return n;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Measures the pixel width text would render at with the given CSS font shorthand, via an
// offscreen canvas. Used to size the rotated row-category cell so a single long word never has
// to be sliced mid-word to fit — the height just needs to be >= its widest single word.
let _measureCanvas = null;
function measureTextWidth(text, font){
  if(!_measureCanvas) _measureCanvas = document.createElement('canvas');
  const ctx = _measureCanvas.getContext('2d');
  ctx.font = font;
  return ctx.measureText(text).width;
}

/* ============================= RENDER: INPUT LIST ============================= */
const inputCollapsed = new Set();
const outputCollapsed = new Set();
let unusedInputsCollapsed = true;

function matchesInputFilter(it, filter){
  return !filter || it.label.toLowerCase().includes(filter) || String(it.num).includes(filter);
}

// On-screen display numbering is independent of the stored `item.num` (which is a fixed,
// never-recalculated value used internally for sorting/filtering, and which develops gaps
// once inputs are moved to the unused pool). For display, each category's active
// (non-unused, has-at-least-one-output) inputs are numbered 1..N fresh, restarting per
// category, so the visible badges always read as a clean local sequence. Returns null for
// items that aren't currently "active" in any category (e.g. unused-pool items), so callers
// can fall back to the stored item.num.
function categoryDisplayNum(itemId){
  for(const cat of state.inputCategories){
    const activeItems = cat.items.filter(it => !it.notUsed && countChecked(it.id) > 0);
    const idx = activeItems.findIndex(it => it.id === itemId);
    if(idx >= 0) return idx + 1;
  }
  return null;
}

function makeInputRow(it, cat, opts){
  opts = opts || {};
  const row = document.createElement('div');
  row.className = 'row-item' + (it.notUsed?' notused':'') + (it.id===selectedInputId?' selected':'');
  const n = countChecked(it.id);
  const displayNum = categoryDisplayNum(it.id);
  const numLabel = displayNum!=null ? displayNum : (it.num!=null ? it.num : '');
  // .row-content is the visible, draggable surface; .row-swipe-bg sits behind it and is only
  // revealed while swiping left, so it never draws anything when the row is at rest.
  row.innerHTML = `<div class="row-swipe-bg">CLEAR OUTPUTS</div>
    <div class="row-content">
      ${!it.notUsed ? `<input type="checkbox" class="bulk-check" title="Select for bulk clear">` : `<span class="bulk-check-spacer"></span>`}
      <span class="num">${numLabel}</span>
      <span class="lbl">${escapeHtml(it.label)}${opts.showCat ? ` <span class="cat-tag">${escapeHtml(cat.name)}</span>` : ''}</span>
      ${!it.notUsed && n>0 ? `<span class="badge">${n}</span>` : ''}
      <span class="del" data-act="del" title="Delete">✕</span>
    </div>`;
  const content = row.querySelector('.row-content');
  if(!it.notUsed){
    const cb = row.querySelector('.bulk-check');
    cb.checked = bulkSelectedInputs.has(it.id);
    cb.addEventListener('click', e=> e.stopPropagation());
    cb.addEventListener('change', ()=>{
      if(cb.checked) bulkSelectedInputs.add(it.id); else bulkSelectedInputs.delete(it.id);
      updateBulkBar();
    });
    row.addEventListener('click', (e)=>{
      if(row.dataset.swiping==='1') return; // suppress the click a swipe gesture leaves behind
      if(e.target.closest('[data-act="del"]') || e.target.closest('.bulk-check')) return;
      selectedInputId = it.id;
      renderInputList();
      renderOutputPanel();
    });
    row.querySelector('.lbl').addEventListener('dblclick', (e)=>{
      e.stopPropagation();
      const val = prompt('Edit input label:', it.label);
      if(val!=null && val.trim()){ it.label = val.trim(); renderInputList(); if(selectedInputId===it.id) renderOutputPanel(); }
    });
    // Swipe left to instantly clear all outputs for this input, same effect as the "Clear all
    // outputs" button — but no confirmation dialog, just swipe far enough and release.
    if(n>0) attachSwipeToClear(row, content, it);
  }
  row.querySelector('[data-act="del"]').addEventListener('click', (e)=>{
    e.stopPropagation();
    if(!confirm(`Delete input "${it.label}"?`)) return;
    const idx = cat.items.findIndex(x=>x.id===it.id);
    cat.items.splice(idx,1);
    delete state.matrix[it.id];
    bulkSelectedInputs.delete(it.id);
    if(selectedInputId===it.id) selectedInputId=null;
    renderAll();
  });
  return row;
}

function attachSwipeToClear(row, content, it){
  const THRESHOLD = 90;   // px of leftward drag required to trigger the clear
  const MAX_DRAG = 130;
  let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, horizontal = false;

  function reset(animate){
    content.style.transition = animate ? 'transform .18s ease' : '';
    content.style.transform = '';
  }
  content.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(e.target.closest('[data-act="del"]') || e.target.closest('.bulk-check')) return;
    startX = e.clientX; startY = e.clientY; dx = 0; dragging = true; decided = false; horizontal = false;
    content.style.transition = '';
  });
  content.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const curDx = e.clientX - startX, curDy = e.clientY - startY;
    if(!decided){
      if(Math.abs(curDx) < 6 && Math.abs(curDy) < 6) return;
      decided = true;
      horizontal = Math.abs(curDx) > Math.abs(curDy);
      if(horizontal){
        row.dataset.swiping = '1';
        if(content.setPointerCapture) content.setPointerCapture(e.pointerId);
      }
    }
    if(!horizontal){ dragging = false; reset(false); return; }
    e.preventDefault();
    dx = Math.min(0, Math.max(-MAX_DRAG, curDx));
    content.style.transform = `translateX(${dx}px)`;
  });
  function finish(){
    if(!dragging) return;
    dragging = false;
    if(horizontal && dx <= -THRESHOLD){
      content.style.transition = 'transform .15s ease, opacity .15s ease';
      content.style.transform = 'translateX(-100%)';
      content.style.opacity = '0';
      setTimeout(()=>{ delete state.matrix[it.id]; renderAll(); }, 140);
    } else {
      reset(true);
    }
    if(horizontal) setTimeout(()=>{ delete row.dataset.swiping; }, 50);
  }
  content.addEventListener('pointerup', finish);
  content.addEventListener('pointercancel', ()=>{ dragging=false; reset(true); if(horizontal) setTimeout(()=>{ delete row.dataset.swiping; }, 50); });
}

function updateBulkBar(){
  const btn = document.getElementById('btnClearSelectedInputs');
  const xBtn = document.getElementById('btnDeselectInputs');
  const n = bulkSelectedInputs.size;
  if(n===0){ btn.style.display='none'; xBtn.style.display='none'; return; }
  btn.style.display='inline-block';
  xBtn.style.display='inline-block';
  btn.textContent = `Clear outputs for ${n} selected input${n>1?'s':''}`;
}

function renderInputList(){
  const wrap = document.getElementById('inputList');
  const filter = (document.getElementById('inputSearch').value||'').trim().toLowerCase();
  wrap.innerHTML = '';

  const unusedPool = []; // {cat, item} — notUsed placeholders OR real inputs with 0 outputs currently selected

  state.inputCategories.forEach((cat, ci)=>{
    const activeItems = cat.items.filter(it => !it.notUsed && countChecked(it.id) > 0);
    cat.items.forEach(it=>{ if(it.notUsed || countChecked(it.id)===0) unusedPool.push({cat, item:it}); });

    const matchingActive = activeItems.filter(it => matchesInputFilter(it, filter));
    if(filter && matchingActive.length===0) return;

    const catDiv = document.createElement('div');
    catDiv.className = 'category';

    const head = document.createElement('div');
    head.className = 'cat-head';
    const collapsed = inputCollapsed.has(ci);
    head.innerHTML = `<span class="tri">${collapsed?'▶':'▼'}</span>
      <span class="name" contenteditable="false">${escapeHtml(cat.name)}</span>
      <span class="count">${activeItems.length}/${cat.items.length}</span>
      <button class="tiny" data-act="renamecat" title="Rename category">✎</button>
      <button class="tiny" data-act="delcat" title="Delete category">🗑</button>`;
    head.querySelector('.name').addEventListener('click', e=>{ e.stopPropagation(); });
    head.addEventListener('click', (e)=>{
      if(e.target.closest('button')) return;
      if(inputCollapsed.has(ci)) inputCollapsed.delete(ci); else inputCollapsed.add(ci);
      renderInputList();
    });
    head.querySelector('[data-act="renamecat"]').addEventListener('click', (e)=>{
      e.stopPropagation();
      const name = prompt('Category name:', cat.name);
      if(name && name.trim()){ cat.name = name.trim().toUpperCase(); renderInputList(); }
    });
    head.querySelector('[data-act="delcat"]').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(cat.items.length && !confirm(`Delete "${cat.name}" and its ${cat.items.length} input(s)? This also clears any output mappings for them.`)) return;
      cat.items.forEach(it=>{ delete state.matrix[it.id]; if(selectedInputId===it.id) selectedInputId=null; });
      state.inputCategories.splice(ci,1);
      renderAll();
    });
    catDiv.appendChild(head);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'cat-items' + (collapsed?' collapsed':'');
    (filter?matchingActive:activeItems).forEach((it)=>{
      itemsWrap.appendChild(makeInputRow(it, cat));
    });
    if(activeItems.length===0 && !filter){
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'No active inputs — see "Unused inputs" below, or add one.';
      itemsWrap.appendChild(hint);
    }

    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    addRow.innerHTML = `<button data-act="additem">+ Add input</button>`;
    addRow.querySelector('button').addEventListener('click', ()=>{
      const label = prompt('New input label:');
      if(!label || !label.trim()) return;
      const maxNum = Math.max(0, ...allInputItems().map(x=>x.item.num||0));
      cat.items.push({id: uid('i'), num: maxNum+1, label: label.trim().toUpperCase(), notUsed:false});
      renderInputList();
    });
    itemsWrap.appendChild(addRow);

    catDiv.appendChild(itemsWrap);
    wrap.appendChild(catDiv);
  });

  // ---- Unused inputs: pooled across all categories, sorted by number ----
  unusedPool.sort((a,b)=> (a.item.num||0) - (b.item.num||0));
  const matchingUnused = unusedPool.filter(x => matchesInputFilter(x.item, filter));
  if(matchingUnused.length){
    const catDiv = document.createElement('div');
    catDiv.className = 'category unused-section';
    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `<span class="tri">${unusedInputsCollapsed?'▶':'▼'}</span>
      <span class="name">UNUSED INPUTS — AVAILABLE FOR FUTURE USE</span>
      <span class="count">${matchingUnused.length}</span>`;
    head.addEventListener('click', ()=>{ unusedInputsCollapsed = !unusedInputsCollapsed; renderInputList(); });
    catDiv.appendChild(head);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'cat-items' + (unusedInputsCollapsed?' collapsed':'');
    matchingUnused.forEach(({cat,item})=>{
      itemsWrap.appendChild(makeInputRow(item, cat, {showCat:true}));
    });
    catDiv.appendChild(itemsWrap);
    wrap.appendChild(catDiv);
  }

  updateBulkBar();
}

/* ============================= RENDER: OUTPUT PANEL ============================= */
function renderOutputPanel(){
  const empty = document.getElementById('rightEmpty');
  const bar = document.getElementById('selectedInputBar');
  const head = document.getElementById('outputsHead');
  const searchWrap = document.getElementById('outputSearchWrap');
  const list = document.getElementById('outputList');
  const addBtn = document.getElementById('addOutputCat');

  if(!selectedInputId || !findInput(selectedInputId)){
    empty.style.display='flex'; bar.style.display='none'; head.style.display='none';
    searchWrap.style.display='none'; list.style.display='none'; addBtn.style.display='none';
    return;
  }
  const { item: inputItem } = findInput(selectedInputId);
  empty.style.display='none'; bar.style.display='flex'; head.style.display='flex';
  searchWrap.style.display='block'; list.style.display='block'; addBtn.style.display='block';
  { const d = categoryDisplayNum(inputItem.id); document.getElementById('selectedInputLabel').textContent = `#${d!=null?d:inputItem.num} ${inputItem.label}`; }
  const clearBtn = document.getElementById('btnClearInputOutputs');
  const n = countChecked(selectedInputId);
  clearBtn.disabled = n===0;
  clearBtn.textContent = n>0 ? `Clear all outputs for this input (${n})` : 'Clear all outputs for this input';

  const filter = (document.getElementById('outputSearch').value||'').trim().toLowerCase();
  list.innerHTML = '';

  state.outputCategories.forEach((cat, ci)=>{
    const matchingItems = cat.items.filter(it => !filter || it.label.toLowerCase().includes(filter));
    if(filter && matchingItems.length===0) return;

    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    const head2 = document.createElement('div');
    head2.className = 'cat-head';
    const collapsed = outputCollapsed.has(ci);
    const onCount = cat.items.filter(it=>cellState(selectedInputId,it.id)===true).length;
    head2.innerHTML = `<span class="tri">${collapsed?'▶':'▼'}</span>
      <span class="name">${escapeHtml(cat.name)}</span>
      <span class="count">${onCount}/${cat.items.length}</span>
      <button class="tiny" data-act="renamecat" title="Rename category">✎</button>
      <button class="tiny" data-act="delcat" title="Delete category">🗑</button>`;
    head2.addEventListener('click', (e)=>{
      if(e.target.closest('button')) return;
      if(outputCollapsed.has(ci)) outputCollapsed.delete(ci); else outputCollapsed.add(ci);
      renderOutputPanel();
    });
    head2.querySelector('[data-act="renamecat"]').addEventListener('click', (e)=>{
      e.stopPropagation();
      const name = prompt('Category name:', cat.name);
      if(name && name.trim()){ cat.name = name.trim().toUpperCase(); renderOutputPanel(); }
    });
    head2.querySelector('[data-act="delcat"]').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(cat.items.length && !confirm(`Delete "${cat.name}" and its ${cat.items.length} output(s)? This clears any mappings to them.`)) return;
      cat.items.forEach(it=>{ Object.keys(state.matrix).forEach(inId=>{ delete state.matrix[inId][it.id]; }); });
      state.outputCategories.splice(ci,1);
      renderAll();
    });
    catDiv.appendChild(head2);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'cat-items' + (collapsed?' collapsed':'');
    (filter?matchingItems:cat.items).forEach(it=>{
      const row = document.createElement('div');
      row.className = 'out-row' + (it.notUsed?' notused':'');
      const st = cellState(selectedInputId, it.id);
      row.innerHTML = `<span class="lbl">${escapeHtml(it.label)}</span>
        <div class="tri-toggle" ${it.notUsed?'style="visibility:hidden"':''}>
          <button data-v="false" class="${st===false?'active-off':''}">Off</button>
          <button data-v="true" class="${st===true?'active-on':''}">On</button>
          <button data-v="note" class="${st==='note'?'active-note':''}">Note</button>
        </div>
        <span class="del" data-act="del" title="Delete output" style="opacity:.4;cursor:pointer;">✕</span>`;
      if(!it.notUsed){
        row.querySelectorAll('.tri-toggle button').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            let v = btn.dataset.v;
            v = v==='true'?true:(v==='false'?false:v);
            setCellState(selectedInputId, it.id, v);
            renderOutputPanel();
            renderInputList();
          });
        });
      }
      row.querySelector('.lbl').addEventListener('dblclick', ()=>{
        const val = prompt('Edit output label:', it.label);
        if(val!=null && val.trim()){ it.label = val.trim(); renderOutputPanel(); }
      });
      row.querySelector('[data-act="del"]').addEventListener('click', ()=>{
        if(!confirm(`Delete output "${it.label}"?`)) return;
        const idx = cat.items.findIndex(x=>x.id===it.id);
        cat.items.splice(idx,1);
        Object.keys(state.matrix).forEach(inId=>{ delete state.matrix[inId][it.id]; });
        renderAll();
      });
      itemsWrap.appendChild(row);
    });

    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    addRow.innerHTML = `<button data-act="additem">+ Add output</button>`;
    addRow.querySelector('button').addEventListener('click', ()=>{
      const label = prompt('New output label:');
      if(!label || !label.trim()) return;
      cat.items.push({id: uid('o'), idx: allOutputItems().length, label: label.trim().toUpperCase(), notUsed:false});
      renderOutputPanel();
    });
    itemsWrap.appendChild(addRow);

    catDiv.appendChild(itemsWrap);
    list.appendChild(catDiv);
  });
}

function renderAll(){
  renderInputList();
  renderOutputPanel();
  updateStatus();
}
function updateStatus(){
  const nIn = allInputItems().filter(x=>!x.item.notUsed).length;
  const nOut = allOutputItems().filter(x=>!x.item.notUsed).length;
  let mapped = 0;
  Object.values(state.matrix).forEach(row=>{ mapped += Object.keys(row).length; });
  document.getElementById('statusMsg').textContent = `${nIn} inputs · ${nOut} outputs · ${mapped} mappings`;
}

/* ============================= EVENTS: TOP BAR ============================= */
document.getElementById('inputSearch').addEventListener('input', renderInputList);
document.getElementById('outputSearch').addEventListener('input', renderOutputPanel);

document.getElementById('addInputCat').addEventListener('click', ()=>{
  const name = prompt('New input category name:');
  if(!name || !name.trim()) return;
  state.inputCategories.push({name: name.trim().toUpperCase(), items:[]});
  renderInputList();
});
document.getElementById('addOutputCat').addEventListener('click', ()=>{
  const name = prompt('New output category name:');
  if(!name || !name.trim()) return;
  state.outputCategories.push({name: name.trim().toUpperCase(), items:[]});
  renderOutputPanel();
});

document.getElementById('btnReset').addEventListener('click', ()=>{
  if(!confirm('Reset to the original sample matrix? This discards all current edits.')) return;
  loadState(DEFAULT_DATA);
  updateStatus();
});

document.getElementById('btnClearInputOutputs').addEventListener('click', ()=>{
  if(!selectedInputId) return;
  const found = findInput(selectedInputId);
  const label = found ? `#${(categoryDisplayNum(found.item.id)!=null?categoryDisplayNum(found.item.id):found.item.num)} ${found.item.label}` : 'this input';
  const n = countChecked(selectedInputId);
  if(n===0) return; // nothing to clear
  if(!confirm(`Turn off all ${n} output selection(s) for "${label}"? This clears every "On" and "Note" mark for this input across all output groups.`)) return;
  delete state.matrix[selectedInputId];
  renderOutputPanel();
  renderInputList();
  updateStatus();
});

document.getElementById('btnClearSelectedInputs').addEventListener('click', ()=>{
  const ids = Array.from(bulkSelectedInputs).filter(id => countChecked(id) > 0);
  if(ids.length===0){ bulkSelectedInputs.clear(); renderInputList(); return; }
  const totalMappings = ids.reduce((s,id)=>s+countChecked(id),0);
  if(!confirm(`Turn off all outputs for ${ids.length} selected input(s)? This clears ${totalMappings} total output selection(s).`)) return;
  ids.forEach(id => delete state.matrix[id]);
  bulkSelectedInputs.clear();
  renderInputList();
  renderOutputPanel();
  updateStatus();
});

document.getElementById('btnDeselectInputs').addEventListener('click', ()=>{
  bulkSelectedInputs.clear();
  renderInputList();
});

document.getElementById('btnExportJSON').addEventListener('click', ()=>{
  const payload = { drawingTitle: document.getElementById('drawingTitle').value||'', ...state };
  const blob = new Blob([JSON.stringify(payload, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cause_effect_matrix.json';
  document.body.appendChild(a); a.click(); a.remove();
});

document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.inputCategories || !data.outputCategories || !data.matrix) throw new Error('Missing required fields');
      if(data.drawingTitle) document.getElementById('drawingTitle').value = data.drawingTitle;
      loadState(data);
    }catch(err){
      alert('Could not import this file: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('btnFullView').addEventListener('click', ()=>{
  // Modal must be visible (laid out) BEFORE renderMatrixPreview() runs, since it measures real
  // rendered cell positions to place the category-header overlay labels — a display:none table
  // reports zero-size rects for everything.
  document.getElementById('matrixModal').classList.add('open');
  renderMatrixPreview();
});
document.getElementById('closeMatrixModal').addEventListener('click', ()=>{
  document.getElementById('matrixModal').classList.remove('open');
});

/* ============================= PDF EXPORT (native, hand-built PDF file — fixed 11x17 landscape) =============================
   Deliberately NOT using window.print(): iOS Safari's print/AirPrint sheet does not reliably honor
   @page CSS for paper size or orientation — it's a user-controlled OS picker a web page can't set,
   so a printed/"Saved as PDF" output could come out as US Letter Portrait regardless of our CSS.
   Building the PDF file ourselves bakes the exact 11x17 landscape page size into the file itself,
   the same way Export DXF hand-builds a DXF instead of relying on any external drawing tool. */
function pdfSafeText(s){
  // PDF's classic (non-Unicode) text strings are Latin-1/ASCII; strip anything else so byte
  // offsets in the file (computed from JS string .length) stay exact — see buildPdfBytes().
  return String(s).replace(/[^\x20-\x7E]/g, '');
}
function pdfEscape(s){
  return pdfSafeText(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}
function fmtPt(n){
  if(Math.abs(n) < 1e-6) n = 0;
  return (Math.round(n*100)/100).toString();
}
function makePdfPageBuilder(){
  const ops = ['0.75 w'];
  return {
    line(x1,y1,x2,y2){ ops.push(`${fmtPt(x1)} ${fmtPt(y1)} m ${fmtPt(x2)} ${fmtPt(y2)} l S`); },
    text(x,y,sizePt,rotDeg,str,bold){
      if(sizePt<=0) return;
      const font = bold ? '/F2' : '/F1';
      const esc = pdfEscape(str);
      if(!esc) return;
      // General PDF text-rotation matrix [cosθ sinθ -sinθ cosθ x y] — handles any angle (0°, 45°
      // for the diagonal column headers, 90° for vertical row-category labels), not just 0/90.
      let mtx;
      if(rotDeg===0){
        mtx = `1 0 0 1 ${fmtPt(x)} ${fmtPt(y)}`;
      } else {
        const rad = rotDeg*Math.PI/180, c = Math.cos(rad), s = Math.sin(rad);
        mtx = `${fmtPt(c)} ${fmtPt(s)} ${fmtPt(-s)} ${fmtPt(c)} ${fmtPt(x)} ${fmtPt(y)}`;
      }
      ops.push(`BT ${font} ${fmtPt(sizePt)} Tf ${mtx} Tm (${esc}) Tj ET`);
    },
    filledDot(cx,cy,r){
      // Drawn as a many-sided straight-line polygon instead of the 4 cubic-Bezier arcs a true
      // circle needs. Every real PDF viewer renders either one as a solid black disc, but PDF-to-
      // CAD converters (e.g. AutoCAD's PDFIMPORT, even with "convert solid fills" enabled) are
      // well known to fail to turn a Bezier-curved fill into a hatch — the outline imports but
      // stays unfilled. Straight-line polygon fills convert reliably there, and at this dot's
      // printed size (~0.1in) a 24-gon is visually indistinguishable from a true circle.
      const N = 24;
      let s = '';
      for(let i=0;i<N;i++){
        const a = (2*Math.PI*i)/N;
        const x = cx + r*Math.cos(a), y = cy + r*Math.sin(a);
        s += `${fmtPt(x)} ${fmtPt(y)} ${i===0?'m':'l'} `;
      }
      ops.push(s + 'h f');
    },
    toString(){ return ops.join('\n'); }
  };
}
// Serializes a flat array of PDF indirect-object bodies (index 0 unused, 1..N are the objects)
// into a complete, valid PDF byte string with a correct cross-reference table.
function buildPdfBytes(objects){
  let out = '%PDF-1.4\n';
  const offsets = [0];
  for(let i=1;i<objects.length;i++){
    offsets[i] = out.length;
    out += `${i} 0 obj\n${objects[i]}\nendobj\n`;
  }
  const xrefStart = out.length;
  out += `xref\n0 ${objects.length}\n0000000000 65535 f \n`;
  for(let i=1;i<objects.length;i++) out += String(offsets[i]).padStart(10,'0') + ' 00000 n \n';
  out += `trailer\n<< /Size ${objects.length} /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
  return out;
}

function buildMatrixPdf(){
  // Same filtering/renumbering rule as CSV/DXF/preview: inputs with 0 outputs and outputs no
  // input triggers are dropped; empty categories go with them.
  const inCats = state.inputCategories
    .map(cat => ({ name: cat.name, items: cat.items.filter(it => countChecked(it.id) > 0) }))
    .filter(cat => cat.items.length > 0);
  const outCats = state.outputCategories
    .map(cat => ({ name: cat.name, items: cat.items.filter(it => outputUsageCount(it.id) > 0) }))
    .filter(cat => cat.items.length > 0);
  if(inCats.length===0 || outCats.length===0){
    alert('Add at least one input with at least one output selected (and at least one output) before exporting.');
    return null;
  }

  const inputRowsById = new Map();
  const inputRows = [];
  inCats.forEach(cat=>cat.items.forEach(it=>inputRows.push({cat,item:it})));
  inputRows.forEach((r,i)=>{ r.drawNum = i+1; inputRowsById.set(r.item.id, r.drawNum); });
  const outputCols = [];
  outCats.forEach(cat=>cat.items.forEach(it=>outputCols.push({cat,item:it})));

  // ---- geometry, in inches — same overall layout as Export DXF, but sizing/centering here uses
  // real Helvetica glyph metrics (pdfTextWidth) instead of a flat charWidth average, since the PDF
  // is guaranteed to render in actual Helvetica on every compliant viewer ----
  const colW=0.24, textHRow=0.09, textHCol=0.10, textHCat=0.085, textHTitle=0.20;
  const capHRatio = 0.718; // Helvetica cap height, used to vertically center rotated single-line text
  // rowH is set so the row label's own vertical gap to the row's top/bottom dividing lines is the
  // same tight rowPad (0.05in) used to nudge the row text off its own top line and the diagonal
  // column headers off their seam — rather than the far more generous gap that fell out of
  // matching the column header's (colW - textHCol*capHRatio)/2 spacing.
  const rowPad = 0.05;
  const rowH = textHRow*capHRatio + 2*rowPad;
  // number column is sized to snugly fit the longest row number (e.g. "34"), not a flat guess —
  // otherwise short numbers leave a wide dead gap before the label column's dividing line.
  const maxNumW = Math.max(...inputRows.map(r=>pdfTextWidth(String(r.drawNum), textHRow, false)));
  const numColW = maxNumW + 0.05;
  const maxLabelW = Math.max(...inputRows.map(r=>pdfTextWidth(r.item.label, textHRow, false)));
  const labelColW = Math.min(7.5, Math.max(2.2, maxLabelW + 0.3));
  const maxHeaderW = Math.max(...outputCols.map(c=>pdfTextWidth(c.item.label, textHCol, false)));
  const S45 = Math.SQRT1_2; // cos(45°) === sin(45°) — used throughout the diagonal header geometry below
  // Column headers run diagonally at 45° (a common fire-alarm C&E matrix drafting convention)
  // instead of straight up: a short A/B/C... letter-code row sits directly above the data grid
  // (letterRowH tall), and above that the column names run up-and-to-the-right along parallel 45°
  // lines (fanH tall). A 45° line with vertical rise fanH has diagonal length fanH*sqrt(2), so fanH
  // is sized from the longest header's rendered width (plus a little slack) divided by sqrt(2).
  const letterRowH = 0.20;
  const fanH = Math.min(9.0, Math.max(0.6, (maxHeaderW + 0.16) * S45));
  const headerBandH = letterRowH + fanH;
  // Floor and per-category width are both sized off the text's actual rendered thickness (capH),
  // not the generous h*1.4 stacking pitch — that pitch is only needed as the GAP BETWEEN wrapped
  // lines when a name spans more than one, not as the width of the single outermost line, so using
  // it even for the (overwhelmingly common) single-line case reserved far more room than the ink
  // needs. With the category text right-aligned tight against the numbers divider (X1), that extra
  // reserved width just became dead blank space between the text and the drawing's own left border
  // (X0) — this sizes the band to the text plus one small pad instead.
  const rowCatPad = 0.08;
  let rowCatColW = textHCat*capHRatio + rowCatPad;
  inCats.forEach(cat=>{
    const bandLen = Math.max(rowH, cat.items.length*rowH) - 0.06;
    const lines = wrapLabel(cat.name, s=>pdfTextWidth(s, textHCat, true), bandLen);
    rowCatColW = Math.max(rowCatColW, (lines.length-1)*textHCat*1.4 + textHCat*capHRatio + rowCatPad);
  });
  let colCatBandH = 0.34;
  { let accCols = 0;
    outCats.forEach(cat=>{
      const bandLen = Math.max(colW, cat.items.length*colW) - 0.06;
      const lines = wrapLabel(cat.name, s=>pdfTextWidth(s, textHCat, true), bandLen);
      // A category with only 1-2 columns can force its name into 3+ cramped stacked lines, which
      // also stretches this shared band height for every OTHER category too. Past 2 lines, stop
      // wrapping and instead render it as one line that spills into the blank space to the right
      // (mirrors the same fix already applied to the Full matrix preview modal) — the band height
      // then only reflects genuinely-needed single/double-line categories, not the narrow outlier.
      cat._spill = lines.length > 2;
      cat._colStart = accCols;
      colCatBandH = Math.max(colCatBandH, (cat._spill ? 1 : lines.length)*textHCat*1.4 + 0.16);
      accCols += cat.items.length;
    });
  }
  const sysOutputsBandH = 0.40;
  // SYSTEM INPUTS sits in a horizontal title band directly above the row list (see Y1i below),
  // mirroring how SYSTEM OUTPUTS sits in a horizontal band above the column list, rather than
  // occupying its own dedicated vertical strip down the left edge — so there's no separate
  // "sysInputsBandW" column reserved here any more; the row-category band starts right at X0.
  const sysInputsBandH = 0.40;
  const X0=0, X1=X0+rowCatColW, X2=X1+numColW, X3=X2+labelColW, X4=X3;
  const numCols = outputCols.length;
  const X5 = X4 + numCols*colW;
  // If the LAST (rightmost) category's name had to spill past its own narrow column(s) (see
  // above), the spilled text would otherwise float past the drawing's own right border with no
  // frame around it — wrong for a printed/plotted drawing. Extend the outer frame just far enough
  // to enclose it (the real data grid itself stays exactly numCols*colW wide; this only widens the
  // blank margin outside it).
  const lastCat = outCats[outCats.length-1];
  // The fan's own rightmost diagonal divider (right edge of the last real column) rises fanH to
  // the right as it climbs from the letter row up to the category band — the frame needs widening
  // for this alone, even when no category name spills (that's the separate case handled below).
  let frameExtraW = fanH;
  if(lastCat && lastCat._spill){
    // The label is centered within the full span from the category's own left edge out to the
    // extended frame (see rendering below). Real margin on both sides (not just enough to avoid
    // clipping) so the centering is actually visible rather than looking identical to a tight
    // left-aligned fit.
    const lastCatLeftX = X4 + lastCat._colStart*colW;
    const lastLabelW = pdfTextWidth(lastCat.name, textHCat, true);
    frameExtraW = Math.max(frameExtraW, (lastCatLeftX + lastLabelW + 0.5) - X5);
  }
  const X5f = X5 + frameExtraW;
  const headerStackH = headerBandH + colCatBandH + sysOutputsBandH;
  function colLeftX(j){ return X4+j*colW; }
  function colCenterX(j){ return X4+(j+0.5)*colW; }

  // ---- page size: pick the smallest standard drafting sheet (landscape) that fits the WHOLE
  // matrix on a single page at a readable scale; fall back to shrinking further on the largest
  // sheet if even that's not enough. This always produces exactly one page, regardless of how
  // large the matrix is — no pagination/splitting logic needed below.
  const SHEET_SIZES = [
    {w:17, h:11},  // ANSI B
    {w:22, h:17},  // ANSI C
    {w:36, h:24},  // ARCH D
    {w:42, h:30}   // ARCH E
  ];
  const MARGIN_IN = 0.5;
  const naturalH = headerStackH + inputRows.length*rowH;
  const MIN_TEXT_H_IN = 0.07; // ~5pt floor for the row-label text size, used only to pick sheet size
  let PAGE_W_IN, PAGE_H_IN, scale;
  {
    let chosen = null;
    for(const s of SHEET_SIZES){
      const usableW = s.w - 2*MARGIN_IN, usableH = s.h - 2*MARGIN_IN;
      const fitScale = Math.min(1, usableW/X5f, usableH/naturalH);
      if(fitScale >= 1 || fitScale*textHRow >= MIN_TEXT_H_IN){ chosen = {size:s, scale:fitScale}; break; }
    }
    if(!chosen){
      // doesn't comfortably fit even on the largest sheet — shrink further, but stay one page.
      const s = SHEET_SIZES[SHEET_SIZES.length-1];
      const usableW = s.w - 2*MARGIN_IN, usableH = s.h - 2*MARGIN_IN;
      chosen = {size:s, scale: Math.min(usableW/X5f, usableH/naturalH)};
    }
    PAGE_W_IN = chosen.size.w; PAGE_H_IN = chosen.size.h; scale = chosen.scale;
  }
  const usableW_IN = PAGE_W_IN - 2*MARGIN_IN, usableH_IN = PAGE_H_IN - 2*MARGIN_IN;
  const marginPt = MARGIN_IN*72;
  const usableWpt = usableW_IN*72, usableHpt = usableH_IN*72;
  const xOffset = Math.max(0, (usableWpt - X5f*scale*72)/2); // center when narrower than the sheet
  const yOffset = Math.max(0, (usableHpt - naturalH*scale*72)/2); // center when shorter than the sheet
  function toPtX(x_in){ return marginPt + xOffset + x_in*scale*72; }
  function toPtY(y_in){ return marginPt + yOffset + y_in*scale*72; }
  function ptLen(x_in){ return x_in*scale*72; }

  // everything on one page — one row-category band per category, no splitting
  const pdfPages = [{ rows: [], catBands: [] }];
  { let acc = 0;
    inCats.forEach(cat=>{
      const startRow = acc;
      cat.items.forEach(it=>{ pdfPages[0].rows.push({item:it, drawNum:inputRowsById.get(it.id)}); acc++; });
      pdfPages[0].catBands.push({name: cat.name, startRow, rowCount: cat.items.length});
    });
  }

  const dTitle = (document.getElementById('drawingTitle').value||'').trim();
  const pageBodies = pdfPages.map(page=>{
    const p = makePdfPageBuilder();
    const rowCount = page.rows.length;
    const Y0=0, Y1=rowCount*rowH, Y1i=Y1+sysInputsBandH, Y2=Y1+headerBandH, Y3=Y2+colCatBandH, Y4=Y3+sysOutputsBandH;
    const Y1b = Y1+letterRowH; // top of the letter-code row / bottom seam the diagonal fan rises from
    function rowTopY(i){ return Y1-i*rowH; }
    function rowBottomY(i){ return Y1-(i+1)*rowH; }
    function rowCenterY(i){ return (rowTopY(i)+rowBottomY(i))/2; }
    // content anchor shared by the row number/label text AND the data-grid dots/note marks —
    // rowPad below the row's own top divider line (matching the tight hpad gap used for the
    // diagonal column headers), rather than the row's true geometric center, so the whole row
    // (numbers, labels, marks) reads as one vertically aligned unit.
    function rowMarkY(i){ return rowTopY(i) - rowPad - (textHRow*capHRatio)/2; }
    function line(x1,y1,x2,y2){ p.line(toPtX(x1),toPtY(y1),toPtX(x2),toPtY(y2)); }
    function text(x,y,h,rot,str,bold){ p.text(toPtX(x),toPtY(y),ptLen(h),rot,str,bold); }

    function placeHorizontalCentered(cx,cy,availW,str,h,bold){
      const lines = wrapLabel(str, s=>pdfTextWidth(s,h,bold), availW);
      const spacing = h*1.4;
      // vertically center the whole (possibly multi-line) block on cy: baseline of the first line
      // sits half the block's line-spacing above cy, then nudged down by half a cap-height so the
      // glyph ink itself (which rises from the baseline) straddles cy rather than sitting above it.
      let y = cy + (lines.length-1)*spacing/2 - h*capHRatio*0.5;
      lines.forEach(ln=>{ const len = pdfTextWidth(ln,h,bold); text(cx-len/2, y, h, 0, ln, bold); y -= spacing; });
    }
    // Right-aligned vertical text: the insertion x IS the ink's right edge for 90°-rotated text
    // (the glyph's cap-height band extends leftward, in -X, from the insertion point — the same
    // offset the "+h*capHRatio*0.5" nudge above corrects for when centering), so no capH/2
    // correction is needed here: anchoring the raw insertion x at (xRight - pad) puts the ink's
    // right edge flush against xRight with that small pad to spare.
    function placeVerticalRightAligned(xRight,cy,availH,str,h,bold){
      const lines = wrapLabel(str, s=>pdfTextWidth(s,h,bold), availH);
      const spacing = h*1.4;
      const pad = 0.05;
      let x = xRight - pad;
      lines.forEach(ln=>{ const len = pdfTextWidth(ln,h,bold); text(x, cy-len/2, h, 90, ln, bold); x -= spacing; });
    }

    // grid: outer border + the X4 spine (divides row info from data columns, full height).
    // X1/X2/X3 and Y2/Y3 are internal dividers that only apply within the row area / column-header
    // area respectively — extending them into the blank corner block just draws an empty grid there.
    // The outer right border sits at X5f rather than X5 whenever the last category's name spilled
    // past the real data grid (see X5f above) — otherwise that spilled text would float past the
    // drawing's own border with nothing framing it. The blank strip between X5 and X5f is left
    // undivided (no extra column/row lines drawn inside it) on purpose, since it isn't a real column.
    line(X0,Y0,X0,Y4);
    // X4's outer-left border skips the fan band (Y1b..Y2) — the first diagonal fan line already
    // starts at this exact corner (X4,Y1b) and rises to (X4+fanH,Y2), so a straight vertical
    // continuing through that band as well just doubled up on the diagonal right next to where the
    // column-header text begins.
    line(X4,Y0,X4,Y1b);
    line(X4,Y2,X4,Y4);
    line(X5f,Y0,X5f,Y4);
    // The Y1 seam (bottom of the letter-code row / top of row 1) is confined to the real content
    // width (X0..X5) — unlike Y0/Y4, it has no reason to cross the blank margin out to X5f since
    // nothing on either side of it exists out there.
    [Y0,Y4].forEach(y=> line(X0,y,X5f,y));
    line(X0,Y1,X5,Y1);
    // top seam of the SYSTEM INPUTS title band, confined to the row-info section's own width
    // (X0..X4) — analogous to the Y2/Y3 seams on the column side, which are similarly confined to
    // their own section's width instead of running the full outer-frame width.
    line(X0,Y1i,X4,Y1i);
    // short connector at X4 bridging Y1b (where the diagonal fan actually starts) up to Y1i (where
    // the SYSTEM INPUTS seam ends) — the letter row (Y1..Y1b) is shorter than the SYSTEM INPUTS
    // band (Y1..Y1i), so without this the seam's right end and the fan's start point don't meet,
    // leaving a small gap that the since-removed full-height X4 spine used to paper over.
    line(X4,Y1b,X4,Y1i);
    // row dividers + row-category dividers (this page only) — confined to the row area (Y0..Y1).
    // A per-row line through the CATEGORY column (tried briefly) cut through the vertical category
    // text at every single row and looked cluttered, so that column only gets dividers at the
    // row-CATEGORY boundaries, not every row. The numbers column, though, gets a line at every row
    // (matching the labels + data grid) since the numbers are short and a full set of row lines
    // there reads as a normal ruled list rather than clutter.
    [X1,X2].forEach(x=> line(x,Y0,x,Y1));
    for(let i=1;i<rowCount;i++) line(X1, rowTopY(i), X5, rowTopY(i));
    page.catBands.forEach((band,bi)=>{
      if(bi < page.catBands.length-1){ const y = Y1-(band.startRow+band.rowCount)*rowH; line(X0,y,X1,y); }
    });
    // column dividers + column-category dividers (identical on every page) — confined to the
    // column-header area (X4..X5), except Y2/Y3 which also extend into the blank margin (X5..X5f)
    // so the category-name band's own top/bottom borders form a continuous line matching the outer
    // frame above/below it, instead of stopping short and leaving a notch in the border.
    [Y2,Y3].forEach(y=> line(X4,y,X5f,y));
    // Straight verticals only run through the data grid + letter-code row (Y0..Y1b) — above that,
    // the column dividers become the diagonal fan lines drawn below instead.
    // j<=numCols (not j<numCols) so the LAST real column also gets its own right-hand divider.
    for(let j=1;j<=numCols;j++) line(colLeftX(j), Y0, colLeftX(j), Y1b);
    line(X4, Y1b, X5, Y1b); // top seam of the letter-code row (bottom of the diagonal fan)
    // the diagonal fan itself: one 45° line per column boundary (numCols+1 of them, including both
    // outer edges), each rising fanH up-and-to-the-right from its seam point — parallel lines, not
    // a true single-point fan. The rightmost one (at X5) rises into the blank margin out to X5f,
    // which is why the outer frame was widened by at least fanH above.
    for(let j=0;j<=numCols;j++){ const xB = colLeftX(j); line(xB, Y1b, xB+fanH, Y2); }
    { let acc=0; outCats.forEach((cat,ci)=>{ acc+=cat.items.length; if(ci<outCats.length-1){ const x=X4+acc*colW; line(x,Y2,x,Y3); } }); }

    // titles (repeated on every page)
    // SYSTEM INPUTS (horizontal, spans X0..X4, Y1..Y1i) — a title band directly above the row
    // list, mirroring how SYSTEM OUTPUTS is a horizontal band directly above the column list,
    // rather than a vertical strip running the full row height down the left edge.
    placeHorizontalCentered((X0+X4)/2, (Y1+Y1i)/2, X4-X0-0.1, 'SYSTEM INPUTS', textHTitle, true);
    // Centered across the FULL title band (X4..X5f), not just the real data-grid width (X4..X5) —
    // otherwise the title sits visibly left-of-center whenever the frame is widened for a spilled
    // category label.
    placeHorizontalCentered((X4+X5f)/2, (Y3+Y4)/2, X5f-X4-0.1, 'SYSTEM OUTPUTS', textHTitle, true);
    // optional drawing title, centered in the blank corner block above the SYSTEM INPUTS band
    // (X0..X4, Y1i..Y4)
    if(dTitle) placeHorizontalCentered((X0+X4)/2, (Y1i+Y4)/2, X4-X0-0.2, dTitle, 0.16, true);

    // row-category labels (this page's bands only), right-aligned tight against the row-number
    // divider X1 rather than centered in the band — any leftover slack from the shared band width
    // sits on the blank left side (toward X0) instead of splitting on both sides.
    page.catBands.forEach(band=>{
      const yTop = Y1-band.startRow*rowH, yBot = Y1-(band.startRow+band.rowCount)*rowH;
      placeVerticalRightAligned(X1, (yTop+yBot)/2, (yTop-yBot)-0.06, band.name, textHCat, true);
    });
    // column-category labels (identical on every page)
    { let acc=0; outCats.forEach(cat=>{
        const xL=X4+acc*colW, xR=X4+(acc+cat.items.length)*colW;
        if(cat._spill){
          // Centered within the full span from this category's left edge out to the extended
          // outer frame (X5f), not left-aligned — the frame widening above already reserves
          // enough room on both sides for this.
          const labelW = pdfTextWidth(cat.name, textHCat, true);
          const cx = (xL+X5f)/2;
          text(cx-labelW/2, (Y2+Y3)/2 - textHCat*capHRatio*0.5, textHCat, 0, cat.name, true);
        } else {
          placeHorizontalCentered((xL+xR)/2, (Y2+Y3)/2, (xR-xL)-0.06, cat.name, textHCat, true);
        }
        acc += cat.items.length;
    }); }

    // row numbers + labels (this page's rows) — anchored a fixed rowPad below the row's own
    // top divider line (not vertically centered in the row band), matching the same tight hpad
    // gap used to nudge the diagonal column headers off their seam line, rather than the much
    // larger gap that fell out of pure vertical centering.
    page.rows.forEach((r,i)=>{
      const yBase = rowMarkY(i) - (textHRow*capHRatio)/2;
      const numStr = String(r.drawNum);
      const numW = pdfTextWidth(numStr, textHRow, false);
      text(X1+(numColW-numW)/2, yBase, textHRow, 0, numStr, false);
      text(X2+0.03, yBase, textHRow, 0, r.item.label, false);
    });
    // letter codes (A, B, C...), horizontal, centered in each column directly above the data grid.
    outputCols.forEach((c,j)=>{
      const letter = colLetter(j);
      const letterW = pdfTextWidth(letter, textHRow, false);
      text(colCenterX(j)-letterW/2, (Y1+Y1b)/2 - textHRow*0.35, textHRow, 0, letter, false);
    });
    // column headers, running diagonally at 45° above the letter row, bottom-anchored to the same
    // seam (Y1b) every column shares (identical on every page). The anchor point is offset from the
    // strip's own bottom-center (xMid, Y1b): hpad forward along the 45° reading direction so text
    // doesn't start exactly on the seam line, and capH/2 along the perpendicular ("cap-height")
    // direction — derived the same way as the 90°-rotation case above (device_x = x - ty there),
    // generalized to an arbitrary angle: perpendicular unit vector = (sinθ, -cosθ), so centering the
    // text's cap-height band adds (sinθ, -cosθ)*capH/2 to the anchor.
    { const capH = textHCol*capHRatio, hpad = 0.05;
      outputCols.forEach((c,j)=>{
        const xMid = colLeftX(j) + colW/2;
        const ax = xMid + S45*(hpad + capH*0.5);
        const ay = Y1b + S45*(hpad - capH*0.5);
        text(ax, ay, textHCol, 45, c.item.label, false);
      });
    }

    // marks — vertically aligned to rowMarkY (same tightened anchor as the row number/label text
    // above), not the row's true geometric center, so the dots/notes line up with the text again.
    page.rows.forEach((r,i)=>{
      const ym = rowMarkY(i);
      outputCols.forEach((c,j)=>{
        const st = cellState(r.item.id, c.item.id);
        if(st===true){
          const d = Math.min(rowH,colW)*0.62;
          p.filledDot(toPtX(colCenterX(j)), toPtY(ym), ptLen(d/2));
        } else if(st==='note'){
          const s='(1)', h=Math.min(rowH,colW)*0.32, lineLen=pdfTextWidth(s,h,false);
          text(colCenterX(j)-lineLen/2, ym-h*0.35, h, 0, s, false);
        }
      });
    });
    return p.toString();
  });

  // ---- assemble the PDF ----
  const pageWpt = PAGE_W_IN*72, pageHpt = PAGE_H_IN*72;
  const N = pageBodies.length;
  const pagesObjNum=2, fontRegNum=3, fontBoldNum=4, firstPageObjNum=5;
  const kids = pageBodies.map((_,i)=> `${firstPageObjNum+i*2} 0 R`).join(' ');
  const objects = [null];
  objects[1] = `<< /Type /Catalog /Pages ${pagesObjNum} 0 R >>`;
  objects[2] = `<< /Type /Pages /Kids [${kids}] /Count ${N} >>`;
  objects[3] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>`;
  objects[4] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>`;
  pageBodies.forEach((content,i)=>{
    const pageObjNum = firstPageObjNum + i*2, contentObjNum = pageObjNum+1;
    objects[pageObjNum] = `<< /Type /Page /Parent ${pagesObjNum} 0 R /MediaBox [0 0 ${fmtPt(pageWpt)} ${fmtPt(pageHpt)}] /Resources << /Font << /F1 ${fontRegNum} 0 R /F2 ${fontBoldNum} 0 R >> >> /Contents ${contentObjNum} 0 R >>`;
    const byteLen = content.length; // pure ASCII by construction, so char length === byte length
    objects[contentObjNum] = `<< /Length ${byteLen} >>\nstream\n${content}\nendstream`;
  });
  return buildPdfBytes(objects);
}

document.getElementById('btnExportPDF').addEventListener('click', ()=>{
  const content = buildMatrixPdf();
  if(content==null) return;
  const blob = new Blob([content], {type:'application/pdf'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const t = (document.getElementById('drawingTitle').value||'cause_effect_matrix').trim().replace(/[^a-z0-9_\- ]/gi,'').replace(/\s+/g,'_');
  a.download = (t || 'cause_effect_matrix') + '.pdf';
  document.body.appendChild(a); a.click(); a.remove();
});

/* ============================= FULL MATRIX PREVIEW (read-only HTML mirror) ============================= */
function renderMatrixPreview(){
  const host = document.getElementById('matrixScroll');
  // Mirror the DXF export: inputs with no outputs selected are left out entirely, remaining
  // rows renumber sequentially, and categories that end up empty are dropped from the preview.
  const inCats = state.inputCategories
    .map(cat => ({ name: cat.name, items: cat.items.filter(it => countChecked(it.id) > 0) }))
    .filter(cat => cat.items.length > 0);
  // Mirror that same rule for columns: outputs no input currently triggers are dropped, and
  // categories that end up with no columns left are dropped too.
  const outCats = state.outputCategories
    .map(cat => ({ name: cat.name, items: cat.items.filter(it => outputUsageCount(it.id) > 0) }))
    .filter(cat => cat.items.length > 0);
  const totalCols = outCats.reduce((s,c)=>s+c.items.length,0);

  // Flat column list in the same left-to-right order the data cells render in, so colLetter(j)
  // means the same thing here as it does in the PDF/DXF exports (both built from this same
  // category-then-item order).
  const flatCols = [];
  outCats.forEach(c=>c.items.forEach(it=>flatCols.push(it)));

  let html = '<table class="gridtable"><thead>';
  // row 1: corner + SYSTEM OUTPUTS title
  html += '<tr>';
  html += `<th class="corner topleftTitle" rowspan="4" colspan="3"></th>`;
  html += `<th class="outputsTitle" colspan="${totalCols}"><span class="stickyCenter">SYSTEM OUTPUTS</span></th>`;
  html += '</tr>';
  // row 2: output categories
  html += '<tr>';
  outCats.forEach((c,ci)=>{
    // Category headers used to be plain nowrap text, which forced narrow (1-2 column) categories
    // to stretch their whole column width to fit the label on one line. The label itself is now
    // drawn afterward as a separate overlay (see the measurement pass below, right after
    // host.innerHTML is set) instead of living inside this cell, so it can never influence the
    // table's column-width calculation — the cell itself stays empty.
    html += `<th class="colcat" colspan="${c.items.length}" data-catidx="${ci}"></th>`;
  });
  html += '</tr>';
  // row 3: the 45-degree diagonal "fan" band. Left empty on purpose, same reasoning as th.colcat
  // above — the diagonal label text and the diagonal divider lines are drawn as overlays once the
  // band's real height (set from a measurement pass below) is known, mirroring the PDF/DXF exports'
  // fanH band.
  html += '<tr>';
  flatCols.forEach((it,j)=>{
    html += `<th class="colfan ${it.notUsed?'nu':''}" data-colidx="${j}"></th>`;
  });
  html += '</tr>';
  // row 4: single-letter column codes directly above the data grid, mirroring the exports'
  // letterRowH band.
  html += '<tr>';
  flatCols.forEach((it,j)=>{
    html += `<th class="colletter ${it.notUsed?'nu':''}" data-colidx="${j}">${colLetter(j)}</th>`;
  });
  html += '</tr>';
  html += '</thead><tbody>';

  let seq = 0;
  if(inCats.length===0 || outCats.length===0){
    html += `<tr><td colspan="${Math.max(1,3+totalCols)}" style="padding:20px;text-align:center;color:#888;font-style:italic;">No inputs have any outputs selected yet — nothing to preview.</td></tr>`;
  }
  inCats.forEach(cat=>{
    cat.items.forEach((it, i)=>{
      seq++;
      html += '<tr>';
      if(i===0){
        // Height must be at least tall enough to fit the category's single longest word without
        // slicing it mid-word (it wraps at spaces only), and at least the natural row-count height.
        const naturalH = cat.items.length * 25;
        const words = cat.name.split(/\s+/).filter(Boolean);
        const longestWordPx = words.length ? Math.max(...words.map(w=>measureTextWidth(w, '700 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'))) : 0;
        const catH = Math.max(naturalH, Math.ceil(longestWordPx) + 10);
        html += `<td class="rowcat" rowspan="${cat.items.length}" style="height:${catH}px;max-height:${catH}px;">${escapeHtml(cat.name)}</td>`;
      }
      html += `<td class="rownum">${seq}</td>`;
      html += `<td class="rowlabel">${escapeHtml(it.label)}</td>`;
      outCats.forEach(oc=>oc.items.forEach(oit=>{
        const st = cellState(it.id, oit.id);
        const nuClass = (it.notUsed||oit.notUsed) ? 'nu' : '';
        let inner = '';
        if(st===true) inner = '<div class="dotmark"></div>';
        else if(st==='note') inner = '<div class="notemark">(1)</div>';
        html += `<td class="datacell ${nuClass}">${inner}</td>`;
      }));
      html += '</tr>';
    });
  });
  html += '</tbody></table>';
  host.innerHTML = html;
  // add SYSTEM INPUTS vertical band by inserting a leftmost sticky title column via CSS trick:
  // (kept simple: rowcat column carries the visual grouping; overall title shown in header bar)

  // ---- category-header overlay labels ----
  // Each th.colcat was rendered empty on purpose (see above). Now that the table has real layout
  // (the modal must already be open/visible — see the btnFullView handler), measure each one's
  // actual rendered box, word-wrap its label to fit that box's width (same wrapLabel() the PDF/DXF
  // exporters use, so long names never overflow into a neighboring category's label — they used to
  // spill rightward and visibly collide), then draw the (possibly multi-line) label as a separate
  // absolutely-positioned div layered on top, living outside the table entirely so it can never
  // feed back into column sizing.
  const catFont = '700 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const measureCat = s => measureTextWidth(s, catFont);
  const catLines = outCats.map((c,ci)=>{
    const th = host.querySelector(`th.colcat[data-catidx="${ci}"]`);
    const w = th ? th.getBoundingClientRect().width : 0;
    return wrapLabel(c.name, measureCat, Math.max(10, w - 10));
  });
  // Mirror the PDF/DXF exporters' one exception to "always wrap": the LAST category, if it would
  // need more than 2 lines, is instead drawn as a single line that's allowed to spill rightward
  // past its own band — there's nothing after the last category to collide with (blank scroll area
  // only), same reasoning the exporters use for extending their outer frame past the real grid.
  const lastIdx = outCats.length - 1;
  const lastSpills = lastIdx >= 0 && catLines[lastIdx].length > 2;
  if(lastSpills) catLines[lastIdx] = [outCats[lastIdx].name];
  const lineH = 13; // px per wrapped line, matches .colcatOverlay's line-height at font-size 10.5px
  const maxLines = Math.max(1, ...catLines.map(ls=>ls.length));
  const colcatH = Math.max(22, maxLines*lineH + 10);
  outCats.forEach((c,ci)=>{
    const th = host.querySelector(`th.colcat[data-catidx="${ci}"]`);
    if(th) th.style.height = colcatH + 'px';
  });
  // Row heights just changed (taller categories push row 3's rotated headers further down), so
  // re-measure every rect fresh rather than reusing anything captured before the height update.
  const hostRect = host.getBoundingClientRect();
  // When the last category spills, draw a bordered box to its right — running the full height of
  // the header rows AND every data row below, same as the PDF/DXF exports' outer-frame extension
  // (built up over several earlier revisions: the frame itself, closing its notch at the category
  // band, and the divider between the real last column and the blank margin) — rather than leaving
  // the spilled label floating with no border around it at all.
  let spillBoxW = 0;
  if(lastSpills){
    const th = host.querySelector(`th.colcat[data-catidx="${lastIdx}"]`);
    const table = host.querySelector('table.gridtable');
    if(th && table){
      const r = th.getBoundingClientRect();
      const tableRect = table.getBoundingClientRect();
      const labelWidth = measureCat(outCats[lastIdx].name);
      spillBoxW = Math.max(20, Math.ceil(labelWidth + 40 - r.width));
      const left = r.right - hostRect.left + host.scrollLeft;
      const top = r.top - hostRect.top + host.scrollTop;
      const height = (tableRect.bottom - hostRect.top + host.scrollTop) - top;
      const box = document.createElement('div');
      box.className = 'colcatSpillBox';
      box.style.left = left + 'px';
      box.style.top = top + 'px';
      box.style.width = spillBoxW + 'px';
      box.style.height = height + 'px';
      host.appendChild(box);
    }
  }
  outCats.forEach((c,ci)=>{
    const th = host.querySelector(`th.colcat[data-catidx="${ci}"]`);
    if(!th) return;
    const r = th.getBoundingClientRect();
    const left = r.left - hostRect.left + host.scrollLeft;
    const top = r.top - hostRect.top + host.scrollTop;
    const ov = document.createElement('div');
    ov.className = 'colcatOverlay';
    ov.style.top = top + 'px';
    ov.style.height = r.height + 'px';
    ov.style.left = left + 'px';
    // Centered across the real band PLUS the spill box, matching how the PDF/DXF exports center
    // a spilled label across its extended frame rather than left-aligning it against the real edge.
    ov.style.width = (ci === lastIdx && lastSpills ? r.width + spillBoxW : r.width) + 'px';
    ov.innerHTML = catLines[ci].map(escapeHtml).join('<br>');
    host.appendChild(ov);
  });

  // ---- 45-degree diagonal fan header (mirrors the PDF/DXF exports' fanH band) ----
  // Size the band tall enough for the longest output label to fit along its diagonal run, using
  // the same (label width + pad) * sin45 relationship the exporters use for fanH, in on-screen
  // pixels instead of inches.
  const fanFont = '600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
  const S45 = Math.SQRT1_2;
  const maxHeaderW = flatCols.length ? Math.max(...flatCols.map(it=>measureTextWidth(it.label, fanFont))) : 0;
  const fanH = Math.min(260, Math.max(50, (maxHeaderW + 10) * S45));
  host.querySelectorAll('th.colfan').forEach(th=>{ th.style.height = fanH + 'px'; });

  // Re-measure fresh: setting the fan band's height (and any category-row height change above)
  // shifts everything below it, so any rect captured before this point is stale.
  const hostRect2 = host.getBoundingClientRect();
  const fanCells = flatCols.map((it,j)=>host.querySelector(`th.colfan[data-colidx="${j}"]`));
  const letterCells = flatCols.map((it,j)=>host.querySelector(`th.colletter[data-colidx="${j}"]`));
  if(fanCells.length && fanCells[0] && letterCells[0]){
    const bandTopY = fanCells[0].getBoundingClientRect().top - hostRect2.top + host.scrollTop;
    const bandBottomY = letterCells[0].getBoundingClientRect().top - hostRect2.top + host.scrollTop;
    // Column boundary x-positions (numCols+1 of them), taken from the letter row cells since
    // they sit directly below the fan band and share the same column widths.
    const colX = [];
    letterCells.forEach(td=>{
      const r = td.getBoundingClientRect();
      colX.push(r.left - hostRect2.left + host.scrollLeft);
    });
    colX.push(letterCells[letterCells.length-1].getBoundingClientRect().right - hostRect2.left + host.scrollLeft);

    // Diagonal divider lines: one per column boundary, rising from the letter row's top edge up
    // to the category row's bottom edge, shifted right by fanH — same fan geometry as the
